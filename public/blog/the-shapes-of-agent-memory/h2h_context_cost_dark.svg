<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="100%" height="100%" fill="#1a1a2e" rx="8"/><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c9c9d4; font-size: 18px; }.title { font-size: 31px; font-weight: 700; fill: #ffffff; }.subtitle { font-size: 19px; fill: #c9c9d4; }.tick { font-size: 15px; fill: #8f8f9c; }.small { font-size: 16.5px; fill: #c9c9d4; }.axis { stroke: #55556a; stroke-width: 1.2; }.grid { stroke: #3a3a4e; stroke-width: 1; }</style><text class="title" x="70" y="46">The cost of a retrieval, head-to-head</text><text class="subtitle" x="70" y="74">Median context handed to the reader per question. The hosted graph spends six times the context and still scores lower.</text><line class="grid" x1="110" y1="430.0" x2="1030" y2="430.0"/><text class="tick" x="98" y="435.0" text-anchor="end">0k</text><line class="grid" x1="110" y1="372.0" x2="1030" y2="372.0"/><text class="tick" x="98" y="377.0" text-anchor="end">5k</text><line class="grid" x1="110" y1="314.0" x2="1030" y2="314.0"/><text class="tick" x="98" y="319.0" text-anchor="end">10k</text><line class="grid" x1="110" y1="256.0" x2="1030" y2="256.0"/><text class="tick" x="98" y="261.0" text-anchor="end">15k</text><line class="grid" x1="110" y1="198.0" x2="1030" y2="198.0"/><text class="tick" x="98" y="203.0" text-anchor="end">20k</text><line class="grid" x1="110" y1="140.0" x2="1030" y2="140.0"/><text class="tick" x="98" y="145.0" text-anchor="end">25k</text><rect x="181.0" y="383.6" width="88.0" height="46.4" rx="3" fill="#2a78d6" opacity="1"/><text class="small" x="225.0" y="375.6" text-anchor="middle" style="fill:#2a78d6;font-weight:600">4.0k</text><text class="tick" x="225.0" y="454" text-anchor="middle">Hybrid</text><rect x="411.0" y="389.4" width="88.0" height="40.6" rx="3" fill="#2a78d6" opacity="0.55"/><text class="small" x="455.0" y="381.4" text-anchor="middle" style="fill:#2a78d6;font-weight:600">3.5k</text><text class="tick" x="455.0" y="454" text-anchor="middle">Place (MemPalace)</text><rect x="641.0" y="180.6" width="88.0" height="249.4" rx="3" fill="#1baf7a" opacity="1"/><text class="small" x="685.0" y="172.6" text-anchor="middle" style="fill:#1baf7a;font-weight:600">21.5k</text><text class="tick" x="685.0" y="454" text-anchor="middle">Zep Cloud</text><rect x="871.0" y="338.4" width="88.0" height="91.6" rx="3" fill="#1baf7a" opacity="0.55"/><text class="small" x="915.0" y="330.4" text-anchor="middle" style="fill:#1baf7a;font-weight:600">7.9k</text><text class="tick" x="915.0" y="454" text-anchor="middle">Graphiti OSS</text><line class="axis" x1="110" y1="430" x2="1030" y2="430"/><text class="small" x="110" y="496" style="fill:#8f8f9c">Chars of retrieved context per question. The other cost sits at ingest: raw-turn stores embed, the graphs reason per message,</text><text class="small" x="110" y="520" style="fill:#8f8f9c">roughly 600 single-stream GPU-days per run at LongMemEval-M scale, against hours for the embedding-only stores.</text></svg>