<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="100%" height="100%" fill="#fcfcfb" rx="8"/><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52514e; font-size: 18px; }.title { font-size: 31px; font-weight: 700; fill: #0b0b0b; }.subtitle { font-size: 19px; fill: #52514e; }.tick { font-size: 15px; fill: #898781; }.small { font-size: 16.5px; fill: #52514e; }.axis { stroke: #c3c2b7; stroke-width: 1.2; }.grid { stroke: #e1e0d9; stroke-width: 1; }</style><text class="title" x="70" y="46">The cost of an answer, LongMemEval-S</text><text class="subtitle" x="70" y="74">Model tokens (prompt+completion), ingest amortized per question. The write path dominates.</text><line class="grid" x1="110" y1="440.0" x2="1030" y2="440.0"/><text class="tick" x="98" y="445.0" text-anchor="end">0k</text><line class="grid" x1="110" y1="395.7" x2="1030" y2="395.7"/><text class="tick" x="98" y="400.7" text-anchor="end">100k</text><line class="grid" x1="110" y1="351.4" x2="1030" y2="351.4"/><text class="tick" x="98" y="356.4" text-anchor="end">200k</text><line class="grid" x1="110" y1="307.1" x2="1030" y2="307.1"/><text class="tick" x="98" y="312.1" text-anchor="end">300k</text><line class="grid" x1="110" y1="262.9" x2="1030" y2="262.9"/><text class="tick" x="98" y="267.9" text-anchor="end">400k</text><line class="grid" x1="110" y1="218.6" x2="1030" y2="218.6"/><text class="tick" x="98" y="223.6" text-anchor="end">500k</text><line class="grid" x1="110" y1="174.3" x2="1030" y2="174.3"/><text class="tick" x="98" y="179.3" text-anchor="end">600k</text><line class="grid" x1="110" y1="130.0" x2="1030" y2="130.0"/><text class="tick" x="98" y="135.0" text-anchor="end">700k</text><rect x="268.0" y="312.9" width="64" height="127.1" rx="3" fill="#eb6834"/><text class="small" x="300.0" y="304.9" text-anchor="middle" style="fill:#eb6834;font-weight:600">287k</text><rect x="348.0" y="431.6" width="64" height="8.4" rx="3" fill="#2a78d6"/><text class="small" x="380.0" y="423.6" text-anchor="middle" style="fill:#2a78d6;font-weight:600">19k</text><text class="tick" x="340.0" y="464" text-anchor="middle">Reasoning tokens per question</text><rect x="728.0" y="145.5" width="64" height="294.5" rx="3" fill="#eb6834"/><text class="small" x="760.0" y="137.5" text-anchor="middle" style="fill:#eb6834;font-weight:600">665k</text><rect x="808.0" y="428.0" width="64" height="12.0" rx="3" fill="#2a78d6"/><text class="small" x="840.0" y="420.0" text-anchor="middle" style="fill:#2a78d6;font-weight:600">27k</text><text class="tick" x="800.0" y="464" text-anchor="middle">Reasoning tokens per correct answer</text><line class="axis" x1="110" y1="440" x2="1030" y2="440"/><rect x="110" y="496" width="17" height="17" rx="3" fill="#eb6834"/><text class="small" x="136" y="510">File-based: the model reasons on every write</text><rect x="110" y="524" width="17" height="17" rx="3" fill="#2a78d6"/><text class="small" x="136" y="538">Structured: no model on the write path (plus ~108k embedder tokens/question, a different currency)</text></svg>