<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="100%" height="100%" fill="#fcfcfb" rx="8"/><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52514e; font-size: 18px; }.title { font-size: 31px; font-weight: 700; fill: #0b0b0b; }.subtitle { font-size: 19px; fill: #52514e; }.tick { font-size: 15px; fill: #898781; }.small { font-size: 16.5px; fill: #52514e; }.axis { stroke: #c3c2b7; stroke-width: 1.2; }.grid { stroke: #e1e0d9; stroke-width: 1; }</style><text class="title" x="70" y="46">The write path is where they diverge, LongMemEval-S</text><text class="subtitle" x="70" y="74">Ingesting one ~50-session history. File-based spends a reasoning call per session; structured just embeds.</text><text class="small" x="70" y="166" style="fill:#eb6834;font-weight:600">File-based</text><rect x="340" y="140" width="540" height="36" rx="7" fill="#eb6834"/><line x1="361.6" y1="140" x2="361.6" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="383.2" y1="140" x2="383.2" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="404.8" y1="140" x2="404.8" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="426.4" y1="140" x2="426.4" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="448.0" y1="140" x2="448.0" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="469.6" y1="140" x2="469.6" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="491.20000000000005" y1="140" x2="491.20000000000005" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="512.8" y1="140" x2="512.8" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="534.4" y1="140" x2="534.4" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="556.0" y1="140" x2="556.0" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="577.6" y1="140" x2="577.6" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="599.2" y1="140" x2="599.2" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="620.8" y1="140" x2="620.8" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="642.4000000000001" y1="140" x2="642.4000000000001" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="664.0" y1="140" x2="664.0" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="685.6" y1="140" x2="685.6" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="707.2" y1="140" x2="707.2" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="728.8" y1="140" x2="728.8" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="750.4000000000001" y1="140" x2="750.4000000000001" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="772.0" y1="140" x2="772.0" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="793.6" y1="140" x2="793.6" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="815.2" y1="140" x2="815.2" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="836.8" y1="140" x2="836.8" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><line x1="858.4000000000001" y1="140" x2="858.4000000000001" y2="176" stroke="#ffffff" stroke-width="1.4" opacity="0.55"/><text class="small" x="896" y="163">~35 min, ~246k tokens</text><text class="tiny" x="340" y="198" style="fill:#898781">Each division is one LLM curation call: read the index, decide what to keep, rewrite a line.</text><text class="small" x="70" y="246" style="fill:#2a78d6;font-weight:600">Structured</text><rect x="340" y="220" width="128" height="36" rx="7" fill="#2a78d6"/><text class="small" x="484" y="243">~5 minutes, embeddings only</text><text class="small" x="340" y="320" style="fill:#898781">The structured bar has no divisions: every write is a vector write, no model reasons,</text><text class="small" x="340" y="344" style="fill:#898781">so the same history ingests roughly 7&#215; faster.</text><text class="small" x="70" y="404" style="fill:#898781">Read paths differ too: file-based greps and reads files over several rounds; structured issues one ranked query.</text></svg>