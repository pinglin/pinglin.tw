<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="100%" height="100%" fill="#1a1a2e" rx="8"/><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c9c9d4; font-size: 18px; }.title { font-size: 31px; font-weight: 700; fill: #ffffff; }.subtitle { font-size: 19px; fill: #c9c9d4; }.tick { font-size: 15px; fill: #8f8f9c; }.small { font-size: 16.5px; fill: #c9c9d4; }.axis { stroke: #55556a; stroke-width: 1.2; }.grid { stroke: #3a3a4e; stroke-width: 1; }</style><text class="title" x="70" y="46">Success rate by actor, ALFWorld</text><text class="subtitle" x="70" y="74">Macro SR over 134 unseen games. Memory moves the weak actor directionally; the frontier actor saturates.</text><line class="grid" x1="100" y1="430.0" x2="1030" y2="430.0"/><text class="tick" x="88" y="435.0" text-anchor="end">0%</text><line class="grid" x1="100" y1="370.0" x2="1030" y2="370.0"/><text class="tick" x="88" y="375.0" text-anchor="end">20%</text><line class="grid" x1="100" y1="310.0" x2="1030" y2="310.0"/><text class="tick" x="88" y="315.0" text-anchor="end">40%</text><line class="grid" x1="100" y1="250.0" x2="1030" y2="250.0"/><text class="tick" x="88" y="255.0" text-anchor="end">60%</text><line class="grid" x1="100" y1="190.0" x2="1030" y2="190.0"/><text class="tick" x="88" y="195.0" text-anchor="end">80%</text><line class="grid" x1="100" y1="130.0" x2="1030" y2="130.0"/><text class="tick" x="88" y="135.0" text-anchor="end">100%</text><rect x="149.0" y="249.1" width="88" height="180.9" rx="3" fill="#5a5a70"/><text class="small" x="193.0" y="241.1" text-anchor="middle" style="fill:#8f8f9c;font-weight:600">60.3</text><text class="tick" x="193.0" y="454" text-anchor="middle">35B</text><rect x="335.0" y="236.5" width="88" height="193.5" rx="3" fill="#2a78d6"/><text class="small" x="379.0" y="228.5" text-anchor="middle" style="fill:#2a78d6;font-weight:600">64.5</text><text class="tick" x="379.0" y="454" text-anchor="middle">35B + bank</text><rect x="521.0" y="142.3" width="88" height="287.7" rx="3" fill="#5a5a70"/><text class="small" x="565.0" y="134.3" text-anchor="middle" style="fill:#8f8f9c;font-weight:600">95.9</text><text class="tick" x="565.0" y="454" text-anchor="middle">Sonnet</text><rect x="707.0" y="138.1" width="88" height="291.9" rx="3" fill="#2a78d6"/><text class="small" x="751.0" y="130.1" text-anchor="middle" style="fill:#2a78d6;font-weight:600">97.3</text><text class="tick" x="751.0" y="454" text-anchor="middle">Sonnet + bank</text><rect x="893.0" y="172.3" width="88" height="257.7" rx="3" fill="#1baf7a"/><text class="small" x="937.0" y="164.3" text-anchor="middle" style="fill:#1baf7a;font-weight:600">85.9</text><text class="tick" x="937.0" y="454" text-anchor="middle">MemHarness (OOD)</text><line class="axis" x1="100" y1="430" x2="1030" y2="430"/><rect x="100" y="496" width="17" height="17" rx="3" fill="#5a5a70"/><text class="small" x="126" y="510">No memory (scaffolds kept)</text><rect x="400" y="496" width="17" height="17" rx="3" fill="#2a78d6"/><text class="small" x="426" y="510">With the experience bank</text><rect x="700" y="496" width="17" height="17" rx="3" fill="#1baf7a"/><text class="small" x="726" y="510">MemHarness, GRPO-trained</text></svg>