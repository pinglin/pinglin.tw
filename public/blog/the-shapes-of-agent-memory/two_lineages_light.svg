<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660"><rect width="100%" height="100%" fill="#fcfcfb" rx="8"/><defs><marker id="ar2_light" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#898781"/></marker></defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52514e; font-size: 18px; }.title { font-size: 31px; font-weight: 700; fill: #0b0b0b; }.subtitle { font-size: 19px; fill: #52514e; }.lab { fill: #0b0b0b; font-weight: 600; }.small { font-size: 16.5px; fill: #52514e; }.tiny { font-size: 15px; fill: #898781; }.mut { fill: #898781; }</style><text class="title" x="55" y="44">Two lineages inside the structured store</text><text class="subtitle" x="55" y="72">Both mine facts automatically. One organizes them by place, the other by entity and time.</text><rect x="55" y="104" width="480" height="510" rx="10" fill="#f3f2ec" stroke="#d8d7cd" stroke-width="1.2"/><text class="lab" x="79" y="140" style="fill:#2a78d6">Place-organized</text><text class="small mut" x="79" y="162">A spatial hierarchy with a layered load policy.</text><rect x="79" y="182" width="432" height="52" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/><text class="small" x="95" y="204" style="fill:#2a78d6;font-weight:600">Always loaded</text><text class="tiny" x="95" y="222">Identity + the most salient facts</text><rect x="367" y="203" width="32" height="10" rx="5" fill="#2a78d6" opacity="0.85"/><rect x="411" y="203" width="32" height="10" rx="5" fill="#2a78d6" opacity="0.6"/><rect x="455" y="203" width="32" height="10" rx="5" fill="#2a78d6" opacity="0.35"/><rect x="79" y="258" width="290" height="90" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/><text class="tiny" x="95" y="282" style="font-weight:600">Room: Project</text><rect x="95" y="300" width="50" height="22" rx="11" fill="#2a78d6" opacity="0.5"/><rect x="157" y="300" width="50" height="22" rx="11" fill="#2a78d6" opacity="0.5"/><rect x="219" y="300" width="50" height="22" rx="11" fill="#2a78d6" opacity="0.5"/><rect x="281" y="300" width="50" height="22" rx="11" fill="#2a78d6" opacity="0.5"/><rect x="79" y="368" width="290" height="90" rx="8" fill="#ffffff" stroke="#d8d7cd" stroke-width="1.3"/><text class="tiny" x="95" y="392" style="font-weight:600">Room: Health</text><rect x="95" y="410" width="50" height="22" rx="11" fill="#2a78d6" opacity="0.32"/><rect x="157" y="410" width="50" height="22" rx="11" fill="#2a78d6" opacity="0.32"/><rect x="219" y="410" width="50" height="22" rx="11" fill="#2a78d6" opacity="0.32"/><rect x="79" y="478" width="290" height="90" rx="8" fill="#ffffff" stroke="#d8d7cd" stroke-width="1.3"/><text class="tiny" x="95" y="502" style="font-weight:600">Room: Travel</text><rect x="95" y="520" width="50" height="22" rx="11" fill="#2a78d6" opacity="0.32"/><rect x="157" y="520" width="50" height="22" rx="11" fill="#2a78d6" opacity="0.32"/><rect x="219" y="520" width="50" height="22" rx="11" fill="#2a78d6" opacity="0.32"/><text class="tiny" x="391" y="287.0" style="font-weight:600">Scoped recall</text><line x1="487" y1="301.0" x2="377" y2="301.0" stroke="#898781" stroke-width="2" marker-end="url(#ar2_light)"/><line x1="487" y1="321.0" x2="487" y2="541.0" stroke="#898781" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="487" y1="321.0" x2="377" y2="321.0" stroke="#898781" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar2_light)"/><line x1="487" y1="431.0" x2="377" y2="431.0" stroke="#898781" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar2_light)"/><line x1="487" y1="541.0" x2="377" y2="541.0" stroke="#898781" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#ar2_light)"/><text class="tiny" x="477" y="482.0" text-anchor="end" style="font-weight:600">Broad search</text><text class="tiny" x="477" y="498.0" text-anchor="end">(fallback)</text><text class="small" x="295.0" y="594" text-anchor="middle" style="fill:#2a78d6">Cheap writes &#183; No entity merge &#183; Freshness by ranking</text><rect x="565" y="104" width="480" height="510" rx="10" fill="#f3f2ec" stroke="#d8d7cd" stroke-width="1.2"/><text class="lab" x="589" y="140" style="fill:#1baf7a">Entity-and-time</text><text class="small mut" x="589" y="162">A knowledge graph keyed to who, linked to when.</text><line x1="685" y1="318" x2="851" y2="222.0" stroke="#1baf7a" stroke-width="2.4"/><line x1="685" y1="318" x2="851" y2="292.0" stroke="#1baf7a" stroke-width="2.4"/><line x1="685" y1="318" x2="851" y2="362.0" stroke="#1baf7a" stroke-width="2.4"/><line x1="685" y1="318" x2="851" y2="432.0" stroke="#1baf7a" stroke-width="2.4" stroke-dasharray="6 5" opacity="0.5"/><circle cx="685" cy="318" r="36" fill="#1baf7a" opacity="0.14"/><circle cx="685" cy="318" r="27" fill="#1baf7a"/><text x="685" y="324" text-anchor="middle" style="font-size:16px;fill:#ffffff;font-weight:700">E</text><text class="tiny" x="685" y="266" text-anchor="middle" style="font-weight:600">One resolved entity</text><g opacity="1"><rect x="851" y="200" width="170" height="44" rx="7" fill="#ffffff" stroke="#1baf7a" stroke-width="1.6"/><text class="tiny" x="863" y="216" style="font-weight:600">Fact A</text><text class="tiny" x="863" y="231">2023-03 &#8594;</text></g><g opacity="1"><rect x="851" y="270" width="170" height="44" rx="7" fill="#ffffff" stroke="#1baf7a" stroke-width="1.6"/><text class="tiny" x="863" y="286" style="font-weight:600">Fact B</text><text class="tiny" x="863" y="301">2023-05 &#8594;</text></g><g opacity="1"><rect x="851" y="340" width="170" height="44" rx="7" fill="#ffffff" stroke="#1baf7a" stroke-width="1.6"/><text class="tiny" x="863" y="356" style="font-weight:600">Fact C</text><text class="tiny" x="863" y="371">2023-08 &#8594;</text></g><g opacity="0.55"><rect x="851" y="410" width="170" height="44" rx="7" fill="#ffffff" stroke="#1baf7a" stroke-width="1.6"/><text class="tiny" x="863" y="426" style="font-weight:600">Fact D</text><text class="tiny" x="863" y="441">2022-01 &#8594; 2023-04</text></g><text class="tiny" x="1021" y="474" text-anchor="end" style="fill:#eb6834">Superseded: window closed</text><line x1="605" y1="528" x2="1005" y2="528" stroke="#d8d7cd" stroke-width="1.5"/><rect x="625" y="511" width="145" height="10" rx="5" fill="#1baf7a" opacity="0.45"/><rect x="770" y="511" width="195" height="10" rx="5" fill="#1baf7a"/><line x1="770" y1="502" x2="770" y2="535" stroke="#eb6834" stroke-width="2.5"/><text class="tiny" x="625" y="552">Old fact</text><text class="tiny" x="774" y="552">New fact closes the old window</text><text class="small" x="805.0" y="594" text-anchor="middle" style="fill:#1baf7a">Entity aggregation &#183; Validity windows &#183; LLM at ingest</text></svg>