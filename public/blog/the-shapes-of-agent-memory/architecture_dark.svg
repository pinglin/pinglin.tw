<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660"><rect width="100%" height="100%" fill="#1a1a2e" rx="8"/><defs><marker id="arc_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8f8f9c"/></marker></defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c9c9d4; font-size: 18px; }.title { font-size: 31px; font-weight: 700; fill: #ffffff; }.subtitle { font-size: 19px; fill: #c9c9d4; }.lab { fill: #ffffff; font-weight: 600; font-size: 16.5px; }.small { font-size: 16.5px; fill: #c9c9d4; }.tiny { font-size: 15px; fill: #8f8f9c; }.mut { fill: #8f8f9c; }</style><text class="title" x="55" y="44">The two store architectures</text><text class="subtitle" x="55" y="72">Both sit beside a frozen model. They differ in how a fact gets in (write) and how it comes back (read).</text><rect x="55" y="104" width="480" height="506" rx="10" fill="#24243a" stroke="#3a3a4e" stroke-width="1.2"/><rect x="565" y="104" width="480" height="506" rx="10" fill="#24243a" stroke="#3a3a4e" stroke-width="1.2"/><text class="lab" x="79" y="140" style="fill:#eb6834">File-based memory</text><text class="small mut" x="79" y="162">An index plus topic files. The model curates.</text><rect x="195.0" y="180" width="200" height="44" rx="8" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.6"/><text class="lab" x="295.0" y="208.0" text-anchor="middle">New turn</text><line x1="295.0" y1="224" x2="295.0" y2="249" stroke="#8f8f9c" stroke-width="1.8" marker-end="url(#arc_dark)"/><text class="tiny" x="305.0" y="244.0">Model decides</text><rect x="170.0" y="254" width="250" height="56" rx="8" fill="#2e2e46" stroke="#eb6834" stroke-width="1.6"/><text class="lab" x="295.0" y="278" text-anchor="middle">Write / edit a file</text><text class="tiny" x="295.0" y="298" text-anchor="middle">One line to the index</text><line x1="295.0" y1="310" x2="295.0" y2="335" stroke="#8f8f9c" stroke-width="1.8" marker-end="url(#arc_dark)"/><rect x="185.0" y="340" width="220" height="56" rx="8" fill="#2e2e46" stroke="#eb6834" stroke-width="1.6"/><text class="lab" x="295.0" y="364" text-anchor="middle">MEMORY.md</text><text class="tiny" x="295.0" y="384" text-anchor="middle">Index, ~200 lines</text><line x1="295.0" y1="396" x2="133.0" y2="429" stroke="#8f8f9c" stroke-width="1.6" marker-end="url(#arc_dark)"/><rect x="87.0" y="434" width="92" height="42" rx="8" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.3"/><text class="lab" x="133.0" y="461.0" text-anchor="middle">Topic</text><line x1="295.0" y1="396" x2="241.0" y2="429" stroke="#8f8f9c" stroke-width="1.6" marker-end="url(#arc_dark)"/><rect x="195.0" y="434" width="92" height="42" rx="8" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.3"/><text class="lab" x="241.0" y="461.0" text-anchor="middle">Topic</text><line x1="295.0" y1="396" x2="349.0" y2="429" stroke="#8f8f9c" stroke-width="1.6" marker-end="url(#arc_dark)"/><rect x="303.0" y="434" width="92" height="42" rx="8" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.3"/><text class="lab" x="349.0" y="461.0" text-anchor="middle">Topic</text><line x1="295.0" y1="396" x2="457.0" y2="429" stroke="#8f8f9c" stroke-width="1.6" marker-end="url(#arc_dark)"/><rect x="411.0" y="434" width="92" height="42" rx="8" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.3"/><text class="lab" x="457.0" y="461.0" text-anchor="middle">Topic</text><text class="tiny" x="295.0" y="544" text-anchor="middle">Read: index in context, then grep + read files</text><text class="small" x="295.0" y="586" text-anchor="middle" style="fill:#eb6834">No embeddings &#183; Literal search &#183; Model-curated</text><text class="lab" x="589" y="140" style="fill:#2a78d6">Structured memory</text><text class="small mut" x="589" y="162">Atomic units in a vector store, plus a fact graph.</text><rect x="705.0" y="180" width="200" height="44" rx="8" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.6"/><text class="lab" x="805.0" y="208.0" text-anchor="middle">New turn</text><line x1="805.0" y1="224" x2="805.0" y2="249" stroke="#8f8f9c" stroke-width="1.8" marker-end="url(#arc_dark)"/><text class="tiny" x="815.0" y="244.0">Auto-extract</text><rect x="670.0" y="254" width="270" height="56" rx="8" fill="#2e2e46" stroke="#2a78d6" stroke-width="1.6"/><text class="lab" x="805.0" y="278" text-anchor="middle">Mine atomic units</text><text class="tiny" x="805.0" y="298" text-anchor="middle">Embed each; no LLM write</text><line x1="805.0" y1="310" x2="691.0" y2="349" stroke="#8f8f9c" stroke-width="1.6" marker-end="url(#arc_dark)"/><line x1="805.0" y1="310" x2="914.0" y2="349" stroke="#8f8f9c" stroke-width="1.6" marker-end="url(#arc_dark)"/><rect x="589" y="354" width="204" height="56" rx="8" fill="#2e2e46" stroke="#2a78d6" stroke-width="1.6"/><text class="lab" x="691.0" y="378" text-anchor="middle">Vector store</text><text class="tiny" x="691.0" y="398" text-anchor="middle">Dense + sparse</text><rect x="807" y="354" width="214" height="56" rx="8" fill="#2e2e46" stroke="#1baf7a" stroke-width="1.6"/><text class="lab" x="914.0" y="378" text-anchor="middle">Fact graph</text><text class="tiny" x="914.0" y="398" text-anchor="middle">Temporal, superseding</text><line x1="793" y1="382" x2="807" y2="382" stroke="#8f8f9c" stroke-width="1.4" stroke-dasharray="4 3"/><line x1="805.0" y1="410" x2="805.0" y2="449" stroke="#8f8f9c" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arc_dark)"/><text class="tiny" x="815.0" y="436">Consolidate (background)</text><rect x="660.0" y="454" width="290" height="44" rx="8" fill="#2e2e46" stroke="#2a78d6" stroke-width="1.6"/><text class="lab" x="805.0" y="482.0" text-anchor="middle">Ranked retrieval + preload</text><text class="tiny" x="805.0" y="544" text-anchor="middle">Read: hybrid search returns top-k; salient units preloaded</text><text class="small" x="805.0" y="586" text-anchor="middle" style="fill:#2a78d6">Embeddings &#183; Ranked recall &#183; Auto-mined</text></svg>