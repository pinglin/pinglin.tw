<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><rect width="100%" height="100%" fill="#1a1a2e" rx="8"/><defs><marker id="exm_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8f8f9c"/></marker><marker id="exg_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1baf7a"/></marker></defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c9c9d4; font-size: 18px; }.title { font-size: 31px; font-weight: 700; fill: #ffffff; }.subtitle { font-size: 19px; fill: #c9c9d4; }.small { font-size: 16.5px; fill: #c9c9d4; }.tiny { font-size: 15px; fill: #8f8f9c; }.mut { fill: #8f8f9c; }</style><text class="title" x="55" y="44">The experience architecture</text><text class="subtitle" x="55" y="72">The bank looks like a structured store; the use of it is a policy trained end-to-end.</text><rect x="55" y="104" width="990" height="496" rx="10" fill="#24243a" stroke="#3a3a4e" stroke-width="1.2"/><path d="M 986,224 L 986,180 L 314,180 L 314,220" fill="none" stroke="#1baf7a" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#exg_dark)"/><text class="small" x="650.0" y="152" text-anchor="middle" style="fill:#1baf7a;font-weight:600">Trained end-to-end with reinforcement learning (GRPO)</text><text class="tiny" x="650.0" y="170" text-anchor="middle">Reward flows back through every stage; format rewards keep retrieval and reconstruction alive</text><rect x="66" y="236" width="168" height="66" rx="8" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.4"/><text class="small" x="150.0" y="263" text-anchor="middle" style="fill:#ffffff;font-weight:600">Observe</text><text class="tiny" x="150.0" y="283" text-anchor="middle">Current state</text><rect x="266" y="236" width="168" height="66" rx="8" fill="#2e2e46" stroke="#1baf7a" stroke-width="1.8"/><text class="small" x="350.0" y="263" text-anchor="middle" style="fill:#ffffff;font-weight:600">Retrieve</text><text class="tiny" x="350.0" y="283" text-anchor="middle">Top-k + sources</text><rect x="466" y="236" width="168" height="66" rx="8" fill="#2e2e46" stroke="#1baf7a" stroke-width="1.8"/><text class="small" x="550.0" y="263" text-anchor="middle" style="fill:#ffffff;font-weight:600">Critique</text><text class="tiny" x="550.0" y="283" text-anchor="middle">Does it apply here?</text><rect x="666" y="236" width="168" height="66" rx="8" fill="#2e2e46" stroke="#1baf7a" stroke-width="1.8"/><text class="small" x="750.0" y="263" text-anchor="middle" style="fill:#ffffff;font-weight:600">Reconstruct</text><text class="tiny" x="750.0" y="283" text-anchor="middle">Rewrite into guidance</text><rect x="866" y="236" width="168" height="66" rx="8" fill="#2e2e46" stroke="#1baf7a" stroke-width="1.8"/><text class="small" x="950.0" y="263" text-anchor="middle" style="fill:#ffffff;font-weight:600">Act</text><text class="tiny" x="950.0" y="283" text-anchor="middle">In the environment</text><line x1="237" y1="269.0" x2="260" y2="269.0" stroke="#8f8f9c" stroke-width="2" marker-end="url(#exm_dark)"/><line x1="437" y1="269.0" x2="460" y2="269.0" stroke="#8f8f9c" stroke-width="2" marker-end="url(#exm_dark)"/><line x1="637" y1="269.0" x2="660" y2="269.0" stroke="#8f8f9c" stroke-width="2" marker-end="url(#exm_dark)"/><line x1="837" y1="269.0" x2="860" y2="269.0" stroke="#8f8f9c" stroke-width="2" marker-end="url(#exm_dark)"/><path d="M 550.0,306 Q 750.0,354 936.0,310" fill="none" stroke="#8f8f9c" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#exm_dark)"/><text class="tiny" x="750.0" y="354" text-anchor="middle">Reject: fall back to self-reasoning</text><rect x="470" y="436" width="360" height="120" rx="10" fill="#2e2e46" stroke="#1baf7a" stroke-width="1.8"/><text class="small" x="494" y="466" style="fill:#ffffff;font-weight:600">Episode bank</text><text class="tiny" x="494" y="486">Summarize &#183; deduplicate &#183; prune by utility</text><polyline points="578,514 614,506 650,518 686,508 722,516" fill="none" stroke="#1baf7a" stroke-width="2" opacity="0.95"/><circle cx="578" cy="514" r="3.5" fill="#1baf7a" opacity="0.95"/><circle cx="614" cy="506" r="3.5" fill="#1baf7a" opacity="0.95"/><circle cx="650" cy="518" r="3.5" fill="#1baf7a" opacity="0.95"/><circle cx="686" cy="508" r="3.5" fill="#1baf7a" opacity="0.95"/><circle cx="722" cy="516" r="3.5" fill="#1baf7a" opacity="0.95"/><polyline points="578,536 614,528 650,540 686,530 722,538" fill="none" stroke="#1baf7a" stroke-width="2" opacity="0.4"/><circle cx="578" cy="536" r="3.5" fill="#1baf7a" opacity="0.4"/><circle cx="614" cy="528" r="3.5" fill="#1baf7a" opacity="0.4"/><circle cx="650" cy="540" r="3.5" fill="#1baf7a" opacity="0.4"/><circle cx="686" cy="530" r="3.5" fill="#1baf7a" opacity="0.4"/><circle cx="722" cy="538" r="3.5" fill="#1baf7a" opacity="0.4"/><path d="M 470,496.0 L 350.0,496.0 L 350.0,310" fill="none" stroke="#8f8f9c" stroke-width="2" marker-end="url(#exm_dark)"/><text class="tiny" x="460" y="522.0" text-anchor="end">Experiences out</text><path d="M 950.0,306 L 950.0,496.0 L 836,496.0" fill="none" stroke="#8f8f9c" stroke-width="2" marker-end="url(#exm_dark)"/><text class="tiny" x="840" y="522.0" text-anchor="start">Episode written back</text><text class="small" x="550.0" y="584" text-anchor="middle" style="fill:#1baf7a">The store is inspectable; the memory behavior lives in the weights</text></svg>