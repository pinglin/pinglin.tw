:600">Write</text><line x1="865" y1="306" x2="787" y2="306" stroke="#8f8f9c" stroke-width="2" marker-end="url(#ovm_dark)"/><text class="tiny" x="823.0" y="328" text-anchor="middle" style="font-weight:600">Retrieve</text><text class="small" x="805.0" y="480" text-anchor="middle">One model, inseparable &#183; Paid in training compute</text></svg>