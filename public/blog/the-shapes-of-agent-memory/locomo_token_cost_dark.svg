<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="100%" height="100%" fill="#1a1a2e" rx="8"/><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c9c9d4; font-size: 18px; }.title { font-size: 31px; font-weight: 700; fill: #ffffff; }.subtitle { font-size: 19px; fill: #c9c9d4; }.tick { font-size: 16px; fill: #8f8f9c; }.small { font-size: 16.5px; fill: #c9c9d4; }.axis { stroke: #55556a; stroke-width: 1.2; }.grid { stroke: #3a3a4e; stroke-width: 1; }</style><text class="title" x="70" y="46">The cost of an answer, LoCoMo</text><text class="subtitle" x="70" y="74">Model-reasoning tokens, ingest amortized per question. Shorter histories shrink the bill; the ordering holds.</text><line class="grid" x1="110" y1="440.0" x2="1030" y2="440.0"/><text class="tick" x="98" y="445.0" text-anchor="end">0k</text><line class="grid" x1="110" y1="336.7" x2="1030" y2="336.7"/><text class="tick" x="98" y="341.7" text-anchor="end">20k</text><line class="grid" x1="110" y1="233.3" x2="1030" y2="233.3"/><text class="tick" x="98" y="238.3" text-anchor="end">40k</text><line class="grid" x1="110" y1="130.0" x2="1030" y2="130.0"/><text class="tick" x="98" y="135.0" text-anchor="end">60k</text><rect x="268.0" y="324.3" width="64" height="115.7" rx="3" fill="#eb6834"/><text class="small" x="300.0" y="316.3" text-anchor="middle" style="fill:#eb6834;font-weight:600">22k</text><rect x="348.0" y="380.1" width="64" height="59.9" rx="3" fill="#2a78d6"/><text class="small" x="380.0" y="372.1" text-anchor="middle" style="fill:#2a78d6;font-weight:600">12k</text><text class="tick" x="340.0" y="464" text-anchor="middle">Reasoning tokens per question</text><rect x="728.0" y="140.3" width="64" height="299.7" rx="3" fill="#eb6834"/><text class="small" x="760.0" y="132.3" text-anchor="middle" style="fill:#eb6834;font-weight:600">58k</text><rect x="808.0" y="319.6" width="64" height="120.4" rx="3" fill="#2a78d6"/><text class="small" x="840.0" y="311.6" text-anchor="middle" style="fill:#2a78d6;font-weight:600">23k</text><text class="tick" x="800.0" y="464" text-anchor="middle">Reasoning tokens per correct answer</text><line class="axis" x1="110" y1="440" x2="1030" y2="440"/><rect x="110" y="496" width="17" height="17" rx="3" fill="#eb6834"/><text class="small" x="136" y="510">File-based: the model reasons at ingest and over a longer read path</text><rect x="110" y="524" width="17" height="17" rx="3" fill="#2a78d6"/><text class="small" x="136" y="538">Structured: zero ingest LLM spend, verified (plus ~0.8k embedder tokens/question, a different currency)</text></svg>