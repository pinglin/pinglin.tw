<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620"><rect width="100%" height="100%" fill="#1a1a2e" rx="8"/><defs><marker id="dro_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#eb6834"/></marker><marker id="drb_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#2a78d6"/></marker><marker id="drm_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8f8f9c"/></marker></defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c9c9d4; font-size: 18px; }.title { font-size: 31px; font-weight: 700; fill: #ffffff; }.subtitle { font-size: 19px; fill: #c9c9d4; }.lab { fill: #ffffff; font-weight: 600; font-size: 16.5px; }.small { font-size: 16.5px; fill: #c9c9d4; }.tiny { font-size: 15px; fill: #8f8f9c; }</style><text class="title" x="55" y="44">Consolidation runs between sessions</text><text class="subtitle" x="55" y="72">Same instinct, opposite geometry: one promotes what gets used, the other merges what repeats.</text><rect x="55" y="104" width="480" height="456" rx="10" fill="#24243a" stroke="#3a3a4e" stroke-width="1.2"/><rect x="565" y="104" width="480" height="456" rx="10" fill="#24243a" stroke="#3a3a4e" stroke-width="1.2"/><text class="lab" x="79" y="138" style="fill:#eb6834">File-based: promote upward</text><text class="tiny" x="79" y="160">Earn a place in the always-loaded index.</text><rect x="185" y="184" width="220" height="56" rx="8" fill="#2e2e46" stroke="#eb6834" stroke-width="1.8"/><text class="lab" x="295.0" y="209" text-anchor="middle">MEMORY.md</text><text class="tiny" x="295.0" y="228" text-anchor="middle">Loaded every session</text><g opacity="1"><rect x="93" y="320" width="92" height="40" rx="7" fill="#2e2e46" stroke="#eb6834" stroke-width="1.5"/><text class="tiny" x="139" y="345" text-anchor="middle">Recalled 5x</text></g><line x1="139" y1="312" x2="237" y2="250" stroke="#eb6834" stroke-width="2" marker-end="url(#dro_dark)"/><g opacity="1"><rect x="199" y="320" width="92" height="40" rx="7" fill="#2e2e46" stroke="#eb6834" stroke-width="1.5"/><text class="tiny" x="245" y="345" text-anchor="middle">Recalled 4x</text></g><line x1="245" y1="312" x2="293" y2="250" stroke="#eb6834" stroke-width="2" marker-end="url(#dro_dark)"/><g opacity="0.5"><rect x="305" y="320" width="92" height="40" rx="7" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.5"/><text class="tiny" x="351" y="345" text-anchor="middle">Recalled 1x</text></g><g opacity="0.5"><rect x="411" y="320" width="92" height="40" rx="7" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.5"/><text class="tiny" x="457" y="345" text-anchor="middle">Recalled 0x</text></g><text class="tiny" x="295.0" y="388" text-anchor="middle">Short-term buffer, deduplicated first</text><text class="tiny" x="295.0" y="414" text-anchor="middle" style="fill:#eb6834;font-weight:600">Gate: score, recall count, distinct queries</text><text class="tiny" x="295.0" y="450" text-anchor="middle" style="fill:#8f8f9c">Runs nightly in three phases, a model doing the judging</text><text class="small" x="295.0" y="540" text-anchor="middle" style="fill:#eb6834">Usage decides what is always known</text><text class="lab" x="589" y="138" style="fill:#2a78d6">Structured: merge sideways</text><text class="tiny" x="589" y="160">Collapse restatements into one canonical unit.</text><rect x="595" y="200" width="200" height="34" rx="7" fill="#2e2e46" stroke="#2a78d6" stroke-width="1.4" opacity="0.75"/><text class="tiny" x="605" y="222">Bought the blue mug</text><rect x="595" y="246" width="200" height="34" rx="7" fill="#2e2e46" stroke="#2a78d6" stroke-width="1.4" opacity="0.75"/><text class="tiny" x="605" y="268">Got a blue mug</text><rect x="595" y="292" width="200" height="34" rx="7" fill="#2e2e46" stroke="#2a78d6" stroke-width="1.4" opacity="0.75"/><text class="tiny" x="605" y="314">Blue mug purchased</text><text class="tiny" x="595" y="190">Three sessions, one fact</text><line x1="803" y1="262" x2="827" y2="262" stroke="#8f8f9c" stroke-width="2" marker-end="url(#drm_dark)"/><text class="tiny" x="595" y="352" style="fill:#2a78d6;font-weight:600">Cosine &#8805; 0.92, on vectors the store already has</text><text class="tiny" x="595" y="376">Longest phrasing wins, provenance kept, no model calls</text><rect x="833" y="240" width="184" height="46" rx="7" fill="#2e2e46" stroke="#2a78d6" stroke-width="2"/><text class="tiny" x="923" y="260" text-anchor="middle" style="font-weight:600">Bought the blue mug</text><text class="tiny" x="923" y="278" text-anchor="middle">Provenance x3</text><rect x="589" y="450" width="432" height="56" rx="8" fill="none" stroke="#8f8f9c" stroke-width="1.4" stroke-dasharray="6 5"/><text class="tiny" x="603" y="472" style="fill:#8f8f9c">Missed: "picked up a cobalt cup", the same event</text><text class="tiny" x="603" y="492" style="fill:#8f8f9c">in other words. Catching it needs a model per pair.</text><text class="tiny" x="595" y="404" style="fill:#8f8f9c">Tiers: exact dedup on write, per chat when idle,</text><text class="tiny" x="595" y="426" style="fill:#8f8f9c">then the whole store daily</text><text class="small" x="805.0" y="540" text-anchor="middle" style="fill:#2a78d6">Similarity catches restatements, not paraphrase</text></svg>