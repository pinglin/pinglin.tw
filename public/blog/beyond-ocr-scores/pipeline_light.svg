<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><rect width="100%" height="100%" fill="#fcfcfb" rx="8"/><defs><marker id="arc_light" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#898781"/></marker><marker id="aro_light" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#eb6834"/></marker></defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52514e; font-size: 18px; }.title { font-size: 31px; font-weight: 700; fill: #0b0b0b; }.subtitle { font-size: 19px; fill: #52514e; }.lab { fill: #0b0b0b; font-weight: 600; font-size: 16.5px; }.tiny { font-size: 15px; fill: #898781; }.band { font-size: 15px; font-weight: 600; letter-spacing: 0.04em; fill: #898781; }</style><text class="title" x="40" y="44">Where the reader sits</text><text class="subtitle" x="40" y="72">Ingestion runs along the top, serving along the bottom.</text><text class="subtitle" x="40" y="96">Nothing on the serving side sees the page — only the text that was read off it.</text><rect x="40" y="134" width="1120" height="234" rx="10" fill="#f3f2ec" stroke="#d8d7cd" stroke-width="1.2"/><text class="band" x="58" y="161">INGEST</text><rect x="70" y="230" width="170" height="56" rx="8" fill="#ffffff" stroke="#d8d7cd" stroke-width="1.6"/><text class="lab" x="155.0" y="254" text-anchor="middle">Documents</text><text class="tiny" x="155.0" y="274" text-anchor="middle">PDFs, scans, photos</text><rect x="270" y="230" width="150" height="56" rx="8" fill="#ffffff" stroke="#d8d7cd" stroke-width="1.6"/><text class="lab" x="345.0" y="254" text-anchor="middle">Text layer?</text><text class="tiny" x="345.0" y="274" text-anchor="middle">Check the PDF</text><rect x="465" y="170" width="230" height="56" rx="8" fill="#ffffff" stroke="#d8d7cd" stroke-width="1.6"/><text class="lab" x="580.0" y="194" text-anchor="middle">Extract text layer</text><text class="tiny" x="580.0" y="214" text-anchor="middle">Born-digital · no OCR</text><text class="tiny" x="580" y="280" text-anchor="middle" style="fill:#eb6834">The eleven readers in this post</text><rect x="465" y="290" width="230" height="56" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="2.2"/><text class="lab" x="580.0" y="314" text-anchor="middle">Read the page</text><text class="tiny" x="580.0" y="334" text-anchor="middle">Scan, photo · layout + OCR</text><rect x="735" y="230" width="210" height="56" rx="8" fill="#ffffff" stroke="#d8d7cd" stroke-width="1.6"/><text class="lab" x="840.0" y="254" text-anchor="middle">Structured text</text><text class="tiny" x="840.0" y="274" text-anchor="middle">Blocks, tables, formulas</text><rect x="980" y="230" width="150" height="56" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/><text class="lab" x="1055.0" y="254" text-anchor="middle">Index</text><text class="tiny" x="1055.0" y="274" text-anchor="middle">Chunk · embed</text><polyline points="240,258 265,258" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#arc_light)"/><polyline points="420,250 460,198" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#arc_light)"/><polyline points="420,266 460,318" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#arc_light)"/><text class="tiny" x="421" y="214">Yes</text><text class="tiny" x="423" y="316">No</text><polyline points="695,198 730,250" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#arc_light)"/><polyline points="695,318 730,266" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#arc_light)"/><polyline points="945,258 975,258" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#arc_light)"/><rect x="40" y="440" width="1120" height="216" rx="10" fill="#f3f2ec" stroke="#d8d7cd" stroke-width="1.2"/><text class="band" x="58" y="467">SERVE</text><rect x="980" y="500" width="150" height="56" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/><text class="lab" x="1055.0" y="524" text-anchor="middle">Retrieve</text><text class="tiny" x="1055.0" y="544" text-anchor="middle">Top-k chunks</text><rect x="570" y="500" width="220" height="56" rx="8" fill="#ffffff" stroke="#d8d7cd" stroke-width="1.6"/><text class="lab" x="680.0" y="524" text-anchor="middle">LLM or agent</text><text class="tiny" x="680.0" y="544" text-anchor="middle">Reasons over the chunks</text><rect x="230" y="500" width="220" height="56" rx="8" fill="#ffffff" stroke="#d8d7cd" stroke-width="1.6"/><text class="lab" x="340.0" y="524" text-anchor="middle">Answer or action</text><text class="tiny" x="340.0" y="544" text-anchor="middle">Only as good as the read</text><rect x="570" y="590" width="220" height="44" rx="8" fill="#ffffff" stroke="#d8d7cd" stroke-width="1.6"/><text class="lab" x="680.0" y="618.0" text-anchor="middle">Question or task</text><polyline points="1055,286 1055,495" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#arc_light)"/><polyline points="980,528 795,528" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#arc_light)"/><polyline points="570,528 455,528" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#arc_light)"/><polyline points="680,590 680,561" fill="none" stroke="#898781" stroke-width="1.8" marker-end="url(#arc_light)"/><polyline points="630,500 630,394 580,394 580,351" fill="none" stroke="#eb6834" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#aro_light)"/><text class="tiny" x="642" y="418" style="fill:#eb6834">Read a page on demand (tool call)</text></svg>