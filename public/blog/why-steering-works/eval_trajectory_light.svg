<circle cx="1000.0" cy="158.0" r="11" fill="none" stroke="#1baf7a" stroke-width="2.5"/>
<text class="onmark" x="992.0" y="134.0" text-anchor="end" style="fill:#1baf7a">Deterministic across two runs</text>
<text class="onmark" x="703.3" y="181.2" text-anchor="middle" style="fill:#eb6834">Two gaps recorded as</text><text class="onmark" x="703.3" y="199.2" text-anchor="middle" style="fill:#eb6834">&#8220;model can&#8217;t do this&#8221;</text>
<text class="small" x="60" y="492">Gap 1 &#183; kept &#8220;waiting on customer&#8221; after the customer delivered and asked back &#8212; lexical anchor beat the state flip</text>
<text class="small" x="60" y="512">Gap 2 &#183; merged into the ticket with the richer history instead of routing to a human &#8212; confidence without evidence</text>
