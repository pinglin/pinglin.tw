<text class="title" x="60" y="42">The &#8220;capability wall&#8221; that wasn&#8217;t</text>
<text class="subtitle" x="60" y="68">Triage-eval accuracy of a local 4-bit ~3B-active MoE. The last jump is two prompt rules derived from a frontier model&#8217;s</text>
<text class="subtitle" x="60" y="90">rationale on the two failing traces &#8212; no code guards, no stronger model, no thinking budget.</text>
