<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
<rect width="100%" height="100%" fill="#fcfcfb" rx="8"/>
<defs><marker id="ar_light" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#898781"/></marker></defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52514e; font-size: 16px; }
.title { font-size: 30px; font-weight: 700; fill: #0b0b0b; }
.subtitle { font-size: 17px; fill: #52514e; }
.lab { fill: #0b0b0b; font-weight: 600; }
.tick { font-size: 14.5px; fill: #898781; }
.onmark { font-weight: 600; font-size: 15px; }
.small { font-size: 14px; }
.axis { stroke: #c3c2b7; stroke-width: 1.2; }
.grid { stroke: #e1e0d9; stroke-width: 1; }
.leader { stroke: #898781; stroke-width: 1; }
</style>
<text class="title" x="60" y="42">Two ways a teacher reaches a student</text>
<text class="subtitle" x="60" y="68">Distillation moves knowledge into the weights, offline. In-context guidance moves it into the context, at inference time.</text>
<text class="lab" x="60" y="118">Weight-space &#183; distillation</text>
<rect x="60" y="140" width="200" height="56" rx="8" fill="#eb6834"/>
<text class="lab" x="160.0" y="174.0" text-anchor="middle" style="fill:#ffffff">Teacher model</text>
<line x1="160" y1="196" x2="160" y2="238" stroke="#898781" stroke-width="2.2" marker-end="url(#ar_light)"/>
<rect x="60" y="240" width="200" height="56" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>
<text class="lab" x="160.0" y="268.0" text-anchor="middle">Logits / traces</text>
<text class="small" x="160.0" y="288.0" text-anchor="middle">Soft labels or synthetic data</text>
<line x1="160" y1="296" x2="160" y2="338" stroke="#898781" stroke-width="2.2" marker-end="url(#ar_light)"/>
<rect x="60" y="340" width="200" height="56" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>
<text class="lab" x="160.0" y="368.0" text-anchor="middle">Training run</text>
<text class="small" x="160.0" y="388.0" text-anchor="middle">GPUs &#183; data pipeline &#183; eval</text>
<line x1="160" y1="396" x2="160" y2="438" stroke="#898781" stroke-width="2.2" marker-end="url(#ar_light)"/>
<rect x="60" y="440" width="200" height="56" rx="8" fill="#2a78d6"/>
<text class="lab" x="160.0" y="468.0" text-anchor="middle" style="fill:#ffffff">Student weights</text>
<text class="small" x="160.0" y="488.0" text-anchor="middle" style="fill:#ffffffdd">Redeploy to update</text>
<line x1="320" y1="446" x2="390" y2="446" stroke="#898781" stroke-width="2.2" marker-end="url(#ar_light)"/>
<text class="onmark" x="335" y="428" style="fill:#eb6834">Days&#8211;weeks</text><text class="small" x="335" y="468">Per iteration;</text><text class="small" x="335" y="485">fixed task distribution</text>
<text class="small" x="60" y="530">Moves the <tspan font-weight="600">prior</tspan> &#8212; general competence, amortized</text>
<text class="lab" x="620" y="118">Context-space &#183; in-context guidance</text>
<rect x="620" y="140" width="200" height="56" rx="8" fill="#eb6834"/>
<text class="lab" x="720.0" y="174.0" text-anchor="middle" style="fill:#ffffff">Teacher model</text>
<line x1="720" y1="196" x2="720" y2="238" stroke="#898781" stroke-width="2.2" marker-end="url(#ar_light)"/>
<rect x="620" y="240" width="200" height="56" rx="8" fill="#1baf7a"/>
<text class="lab" x="720.0" y="268.0" text-anchor="middle" style="fill:#ffffff">Instruction / correction</text>
<text class="small" x="720.0" y="288.0" text-anchor="middle" style="fill:#ffffffdd">A few hundred tokens of text</text>
<line x1="720" y1="296" x2="720" y2="338" stroke="#898781" stroke-width="2.2" marker-end="url(#ar_light)"/>
<rect x="620" y="340" width="200" height="56" rx="8" fill="#2a78d6"/>
<text class="lab" x="720.0" y="368.0" text-anchor="middle" style="fill:#ffffff">Student context</text>
<text class="small" x="720.0" y="388.0" text-anchor="middle" style="fill:#ffffffdd">No weight change</text>
<line x1="720" y1="396" x2="720" y2="438" stroke="#898781" stroke-width="2.2" marker-end="url(#ar_light)"/>
<rect x="620" y="440" width="200" height="56" rx="8" fill="none" stroke="#c3c2b7" stroke-width="1.5"/>
<text class="lab" x="720.0" y="468.0" text-anchor="middle">Output at scale</text>
<text class="small" x="720.0" y="488.0" text-anchor="middle">Millions of cheap calls</text>
<path d="M 840 468 C 940 468 940 168 840 168" fill="none" stroke="#898781" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar_light)"/>
<text class="onmark" x="938" y="310" style="fill:#1baf7a">Seconds</text><text class="small" x="938" y="330">Teacher reviews output,</text><text class="small" x="938" y="347">edits the instruction</text>
<text class="small" x="620" y="530">Conditions the <tspan font-weight="600">posterior</tspan> &#8212; task-specific, instant, auditable</text>
</svg>
