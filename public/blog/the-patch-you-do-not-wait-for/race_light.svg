<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600"><rect width="100%" height="100%" fill="#fcfcfb" rx="8"/><defs><marker id="ar_light" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#b9b7ad"/></marker><marker id="arg_light" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1baf7a"/></marker><marker id="aro_light" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#eb6834"/></marker><marker id="arr_light" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#d64545"/></marker><marker id="arb_light" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#2a78d6"/></marker></defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52514e; font-size: 18px; }.title { font-size: 30px; font-weight: 700; fill: #0b0b0b; }.subtitle { font-size: 18.5px; fill: #52514e; }.lab { fill: #0b0b0b; font-weight: 600; }.small { font-size: 16.5px; }.tiny { font-size: 15px; fill: #898781; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; }</style><text class="title" x="40" y="44" text-anchor="start">The race starts when the fix is published</text><text class="subtitle" x="40" y="74" text-anchor="start">A patch is also a map to the bug, and a model reads maps quickly.</text><line x1="250" y1="470" x2="1050" y2="470" stroke="#b9b7ad" stroke-width="1.5"/><line x1="250.0" y1="470" x2="250.0" y2="477" stroke="#b9b7ad" stroke-width="1.5"/><line x1="250.0" y1="118" x2="250.0" y2="470" stroke="#d8d7cd" stroke-width="1" stroke-dasharray="3 5"/><text class="tiny" x="250.0" y="498" text-anchor="middle">0</text><line x1="474.3" y1="470" x2="474.3" y2="477" stroke="#b9b7ad" stroke-width="1.5"/><line x1="474.3" y1="118" x2="474.3" y2="470" stroke="#d8d7cd" stroke-width="1" stroke-dasharray="3 5"/><text class="tiny" x="474.3052187694093" y="498" text-anchor="middle">6 h</text><line x1="621.0" y1="470" x2="621.0" y2="477" stroke="#b9b7ad" stroke-width="1.5"/><line x1="621.0" y1="118" x2="621.0" y2="470" stroke="#d8d7cd" stroke-width="1" stroke-dasharray="3 5"/><text class="tiny" x="621.0400741982569" y="498" text-anchor="middle">1 day</text><line x1="744.6" y1="470" x2="744.6" y2="477" stroke="#b9b7ad" stroke-width="1.5"/><line x1="744.6" y1="118" x2="744.6" y2="470" stroke="#d8d7cd" stroke-width="1" stroke-dasharray="3 5"/><text class="tiny" x="744.5616034919562" y="498" text-anchor="middle">3 days</text><line x1="841.3" y1="470" x2="841.3" y2="477" stroke="#b9b7ad" stroke-width="1.5"/><line x1="841.3" y1="118" x2="841.3" y2="470" stroke="#d8d7cd" stroke-width="1" stroke-dasharray="3 5"/><text class="tiny" x="841.3238358278502" y="498" text-anchor="middle">1 week</text><line x1="920.9" y1="470" x2="920.9" y2="477" stroke="#b9b7ad" stroke-width="1.5"/><line x1="920.9" y1="118" x2="920.9" y2="470" stroke="#d8d7cd" stroke-width="1" stroke-dasharray="3 5"/><text class="tiny" x="920.8814256313757" y="498" text-anchor="middle">2 weeks</text><line x1="1050.0" y1="470" x2="1050.0" y2="477" stroke="#b9b7ad" stroke-width="1.5"/><line x1="1050.0" y1="118" x2="1050.0" y2="470" stroke="#d8d7cd" stroke-width="1" stroke-dasharray="3 5"/><text class="tiny" x="1050.0" y="498" text-anchor="middle">43 days</text><text class="tiny" x="250" y="112" text-anchor="middle" style="fill:#0b0b0b;font-weight:600">Fix published</text><rect x="526.4" y="259" width="523.6" height="42" rx="6" fill="#d64545" fill-opacity="0.10" stroke="#d64545" stroke-opacity="0.5" stroke-dasharray="5 5"/><text class="tiny" x="848.2027900960093" y="244" text-anchor="middle" style="fill:#d64545;font-weight:600">Exposed: the exploit exists, the fix is not running</text><text class="lab" x="40" y="176" text-anchor="start" style="font-size:17px">Attacker with a model</text><rect x="250.0" y="156" width="276.4" height="28" rx="14" fill="#d64545" fill-opacity="0.85"/><text class="small" x="252.0" y="214" text-anchor="start">Read the diff, write the exploit, scan</text><text class="lab" x="40" y="286" text-anchor="start" style="font-size:17px">Patching by hand</text><rect x="250.0" y="266" width="800.0" height="28" rx="14" fill="#898781" fill-opacity="0.85"/><text class="small" x="252.0" y="324" text-anchor="start">Someone reads the news, files a ticket, waits for a release</text><text class="lab" x="40" y="396" text-anchor="start" style="font-size:17px">A40 Labs, a Critical</text><rect x="250.0" y="376" width="371.0" height="28" rx="14" fill="#1baf7a" fill-opacity="0.85"/><text class="small" x="252.0" y="434" text-anchor="start">PR in 4 h, staging in 12 h, production in 24 h</text><text class="tiny" x="40" y="528" text-anchor="start">Patching by hand: a median of 43 days to fully remediate a CISA KEV vulnerability (Verizon DBIR 2026).</text><text class="tiny" x="40" y="550" text-anchor="start">Attacker: an average time-to-exploit of 5 days in 2023, with 12% of n-days exploited within a day (Mandiant).</text><text class="tiny" x="40" y="572" text-anchor="start">Log scale. The attacker row shows the fast end of that range; the A40 Labs row is our target for a Critical.</text></svg>