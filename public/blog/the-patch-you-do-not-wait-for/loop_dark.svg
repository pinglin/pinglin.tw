<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530"><rect width="100%" height="100%" fill="#1a1a2e" rx="8"/><defs><marker id="ar_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#5a5a76"/></marker><marker id="arg_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1baf7a"/></marker><marker id="aro_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#eb6834"/></marker><marker id="arr_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#d64545"/></marker><marker id="arb_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#2a78d6"/></marker></defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c9c9d4; font-size: 18px; }.title { font-size: 30px; font-weight: 700; fill: #ffffff; }.subtitle { font-size: 18.5px; fill: #c9c9d4; }.lab { fill: #ffffff; font-weight: 600; }.small { font-size: 16.5px; }.tiny { font-size: 15px; fill: #8f8f9c; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; }</style><text class="title" x="40" y="44" text-anchor="start">The CVE loop: scan, patch, gate, release</text><text class="subtitle" x="40" y="74" text-anchor="start">Every step leaves a pull request or a line in the daily digest. Nothing touches production directly.</text><rect x="40" y="120" width="222" height="250" rx="12" fill="#24243a" stroke="#3a3a56" stroke-width="1.2"/><rect x="40" y="120" width="222" height="6" rx="3" fill="#2a78d6"/><text class="lab" x="60" y="164" text-anchor="start" style="font-size:22px">1  Scan</text><text class="small" x="60" y="208" text-anchor="start">Hourly advisory watch</text><text class="small" x="60" y="238" text-anchor="start">Daily sweep with trivy,</text><text class="small" x="60" y="268" text-anchor="start">govulncheck and gitleaks</text><line x1="60" y1="316" x2="242" y2="316" stroke="#3a3a56"/><text class="small" x="60" y="348" text-anchor="start" style="fill:#2a78d6;font-weight:600">Exploited: seen in 1 h</text><rect x="304" y="120" width="222" height="250" rx="12" fill="#24243a" stroke="#3a3a56" stroke-width="1.2"/><rect x="304" y="120" width="222" height="6" rx="3" fill="#1baf7a"/><text class="lab" x="324" y="164" text-anchor="start" style="font-size:22px">2  Patch</text><text class="small" x="324" y="208" text-anchor="start">In each repo, on a match</text><text class="small" x="324" y="238" text-anchor="start">Bumps with its own tool</text><text class="small" x="324" y="268" text-anchor="start">Runs the repo’s checks</text><line x1="324" y1="316" x2="506" y2="316" stroke="#3a3a56"/><text class="small" x="324" y="348" text-anchor="start" style="fill:#1baf7a;font-weight:600">One PR per finding</text><rect x="568" y="120" width="222" height="250" rx="12" fill="#24243a" stroke="#3a3a56" stroke-width="1.2"/><rect x="568" y="120" width="222" height="6" rx="3" fill="#1baf7a"/><text class="lab" x="588" y="164" text-anchor="start" style="font-size:22px">3  Gate</text><text class="small" x="588" y="208" text-anchor="start">Same-major bump:</text><text class="small" x="588" y="238" text-anchor="start">merges itself on green</text><text class="small" x="588" y="268" text-anchor="start">Major bump: a person</text><line x1="588" y1="316" x2="770" y2="316" stroke="#3a3a56"/><text class="small" x="588" y="348" text-anchor="start" style="fill:#1baf7a;font-weight:600">CI gates every merge</text><rect x="832" y="120" width="222" height="250" rx="12" fill="#24243a" stroke="#3a3a56" stroke-width="1.2"/><rect x="832" y="120" width="222" height="6" rx="3" fill="#eb6834"/><text class="lab" x="852" y="164" text-anchor="start" style="font-size:22px">4  Release</text><text class="small" x="852" y="208" text-anchor="start">Staging: automatic</text><text class="small" x="852" y="238" text-anchor="start">Production: a person</text><text class="small" x="852" y="268" text-anchor="start">Paged for a Critical</text><line x1="852" y1="316" x2="1034" y2="316" stroke="#3a3a56"/><text class="small" x="852" y="348" text-anchor="start" style="fill:#eb6834;font-weight:600">Critical ≤ 24 h</text><line x1="266" y1="245.0" x2="300" y2="245.0" stroke="#5a5a76" stroke-width="3" marker-end="url(#ar_dark)"/><line x1="530" y1="245.0" x2="564" y2="245.0" stroke="#5a5a76" stroke-width="3" marker-end="url(#ar_dark)"/><line x1="794" y1="245.0" x2="828" y2="245.0" stroke="#5a5a76" stroke-width="3" marker-end="url(#ar_dark)"/><path d="M 943.0 374 L 943.0 414 L 151.0 414 L 151.0 384" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arb_dark)"/><rect x="302.0" y="397" width="490" height="34" rx="17" fill="#1a1a2e"/><text class="small" x="547.0" y="420" text-anchor="middle" style="fill:#2a78d6;font-weight:600">Next scan: is the fix on main, in staging, in production?</text><text class="tiny" x="40" y="488" text-anchor="start">A fix that cannot be a PR goes in the daily digest, and the owner runs it as one script.</text><text class="tiny" x="40" y="510" text-anchor="start">A finding is silenced only in one ledger, with a reason and an expiry of at most 90 days.</text></svg>