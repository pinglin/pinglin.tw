<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><rect width="100%" height="100%" fill="#1a1a2e" rx="8"/><defs><marker id="ar_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8f8f9c"/></marker><marker id="arb_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#2a78d6"/></marker><marker id="aro_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#eb6834"/></marker><marker id="arg_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1baf7a"/></marker></defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c9c9d4; font-size: 18px; }.title { font-size: 30px; font-weight: 700; fill: #ffffff; }.subtitle { font-size: 18.5px; fill: #c9c9d4; }.lab { fill: #ffffff; font-weight: 600; }.small { font-size: 16.5px; }.tiny { font-size: 15px; fill: #8f8f9c; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; }.mut { fill: #8f8f9c; }</style><text class="title" x="40" y="44">Two regimes of declared state</text><text class="subtitle" x="40" y="74">The same repository. Only one of them notices when reality stops matching it.</text><rect x="40" y="108" width="490" height="320" rx="10" fill="#24243a" stroke="#3a3a4e" stroke-width="1.2"/><text class="lab small" x="62" y="138" style="fill:#1baf7a">Continuously reconciled</text><text class="tiny" x="62" y="159">Cluster objects, dashboards, alert rules</text><text class="tiny" x="102" y="192" text-anchor="end" style="font-size:13px">Drift</text><text class="tiny" x="102" y="361" text-anchor="end" style="font-size:13px">None</text><line x1="114" y1="356" x2="506" y2="356" stroke="#3a3a4e" stroke-width="1.4"/><line x1="114" y1="186" x2="114" y2="356" stroke="#3a3a4e" stroke-width="1.4"/><path d="M114.0,356.0 L175.8,356.0 L187.3,334.0 L202.8,356.0 L268.4,356.0 L280.0,334.0 L295.4,356.0 L357.2,356.0 L368.8,334.0 L384.2,356.0 L442.1,356.0 L453.7,334.0 L469.1,356.0 L500.0,356.0" fill="none" stroke="#1baf7a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text class="tiny" x="307.0" y="294" text-anchor="middle" style="fill:#1baf7a;font-weight:600">Corrected before anyone could look</text><text class="tiny" x="307.0" y="400" text-anchor="middle">The reconciler is its own detector</text><rect x="570" y="108" width="490" height="320" rx="10" fill="#24243a" stroke="#3a3a4e" stroke-width="1.2"/><text class="lab small" x="592" y="138" style="fill:#eb6834">Applied on demand</text><text class="tiny" x="592" y="159">DNS, repositories, buckets, projects</text><text class="tiny" x="632" y="192" text-anchor="end" style="font-size:13px">Drift</text><text class="tiny" x="632" y="361" text-anchor="end" style="font-size:13px">None</text><line x1="644" y1="356" x2="1036" y2="356" stroke="#3a3a4e" stroke-width="1.4"/><line x1="644" y1="186" x2="644" y2="356" stroke="#3a3a4e" stroke-width="1.4"/><rect x="759.8" y="192" width="138.96000000000004" height="164" rx="4" fill="#eb6834" opacity="0.12"/><text class="tiny" x="829.28" y="210" text-anchor="middle" style="fill:#eb6834">Silent: nothing is watching</text><path d="M644.0,356.0 L759.8,356.0 L759.8,322.0 L821.6,322.0 L821.6,288.0 L898.8,288.0" fill="none" stroke="#eb6834" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M898.8,288 L1030.0,196" fill="none" stroke="#8f8f9c" stroke-width="2" stroke-dasharray="6 5"/><text class="tiny" x="1030" y="190" text-anchor="end">Without a scheduled plan</text><path d="M898.8,288 L929.6,288 L929.6,356 L1030.0,356" fill="none" stroke="#eb6834" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="898.76" y1="264" x2="898.76" y2="356" stroke="#eb6834" stroke-width="1.6" stroke-dasharray="4 4"/><text class="tiny" x="888.76" y="252" text-anchor="end" style="fill:#eb6834;font-weight:600">Plan returns non-empty</text><text class="tiny" x="937.36" y="342" style="font-size:13px">Apply</text><path d="M684.3,370 L696.3,370 L690.3,360 Z" fill="#8f8f9c"/><path d="M788.5,370 L800.5,370 L794.5,360 Z" fill="#8f8f9c"/><path d="M892.8,370 L904.8,370 L898.8,360 Z" fill="#8f8f9c"/><path d="M997.0,370 L1009.0,370 L1003.0,360 Z" fill="#8f8f9c"/><text class="tiny" x="837.0" y="400" text-anchor="middle">Scheduled plans are the only detector</text><rect x="40" y="448" width="1020" height="60" rx="9" fill="#24243a" stroke="#3a3a4e" stroke-width="1.2"/><text class="small" x="550" y="484" text-anchor="middle" style="fill:#ffffff">In one regime the absence of drift is a property. In the other it is a claim, and a claim has to be checked.</text></svg>