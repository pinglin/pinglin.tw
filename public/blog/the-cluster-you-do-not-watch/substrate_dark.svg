<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="596" viewBox="0 0 1100 596"><rect width="100%" height="100%" fill="#1a1a2e" rx="8"/><defs><marker id="ar_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8f8f9c"/></marker><marker id="arb_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#2a78d6"/></marker><marker id="aro_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#eb6834"/></marker><marker id="arg_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1baf7a"/></marker></defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c9c9d4; font-size: 18px; }.title { font-size: 30px; font-weight: 700; fill: #ffffff; }.subtitle { font-size: 18.5px; fill: #c9c9d4; }.lab { fill: #ffffff; font-weight: 600; }.small { font-size: 16.5px; }.tiny { font-size: 15px; fill: #8f8f9c; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; }.mut { fill: #8f8f9c; }</style><text class="title" x="40" y="44">The properties are portable; the components are not</text><text class="subtitle" x="40" y="74">Managed or self-managed, the same three properties have to hold. Only the parts change.</text><text class="lab small" x="530.0" y="132" text-anchor="middle" style="fill:#1baf7a">Self-managed (ours)</text><text class="lab small" x="890.0" y="132" text-anchor="middle" style="fill:#2a78d6">Managed control plane</text><rect x="40" y="152" width="300" height="84" rx="9" fill="#24243a" stroke="#3a3a4e" stroke-width="1.2"/><text class="small lab" x="60" y="188">No listening</text><text class="small lab" x="60" y="212">surface</text><rect x="360" y="152" width="340" height="84" rx="9" fill="#2e2e46" stroke="#1baf7a" stroke-width="1.5"/><text class="tiny" x="530.0" y="200" text-anchor="middle">Outbound tunnel only; nothing to scan</text><rect x="720" y="152" width="340" height="84" rx="9" fill="#2e2e46" stroke="#2a78d6" stroke-width="1.5"/><text class="tiny" x="890.0" y="200" text-anchor="middle">Private cluster, managed ingress</text><rect x="40" y="252" width="300" height="84" rx="9" fill="#24243a" stroke="#3a3a4e" stroke-width="1.2"/><text class="small lab" x="60" y="288">Authorization that is</text><text class="small lab" x="60" y="312">not membership</text><rect x="360" y="252" width="340" height="84" rx="9" fill="#2e2e46" stroke="#1baf7a" stroke-width="1.5"/><text class="tiny" x="530.0" y="300" text-anchor="middle">Tag-scoped mesh ACLs, not network reach</text><rect x="720" y="252" width="340" height="84" rx="9" fill="#2e2e46" stroke="#2a78d6" stroke-width="1.5"/><text class="tiny" x="890.0" y="300" text-anchor="middle">IAM and service controls</text><rect x="40" y="352" width="300" height="84" rx="9" fill="#24243a" stroke="#3a3a4e" stroke-width="1.2"/><text class="small lab" x="60" y="388">State that survives</text><text class="small lab" x="60" y="412">the cluster</text><rect x="360" y="352" width="340" height="84" rx="9" fill="#2e2e46" stroke="#1baf7a" stroke-width="1.5"/><text class="tiny" x="530.0" y="400" text-anchor="middle">Off-host object storage, same egress path</text><rect x="720" y="352" width="340" height="84" rx="9" fill="#2e2e46" stroke="#2a78d6" stroke-width="1.5"/><text class="tiny" x="890.0" y="400" text-anchor="middle">Managed snapshots and backups</text><text class="small" x="40" y="474" style="fill:#ffffff">What actually differs is the failure distribution, and therefore how much repair machinery you build:</text><rect x="360" y="496" width="340" height="56" rx="9" fill="#1baf7a" stroke="#1baf7a" stroke-width="1.4" fill-opacity="0.14"/><text class="tiny" x="530" y="522" text-anchor="middle" style="fill:#1baf7a;font-weight:600">Consensus and member failures</text><text class="tiny" x="530" y="542" text-anchor="middle">Yours to diagnose</text><rect x="720" y="496" width="340" height="56" rx="9" fill="#24243a" stroke="#3a3a4e" stroke-width="1.4"/><text class="tiny" x="890" y="530" text-anchor="middle">Somebody else&#8217;s pager &#183; Skip a chapter</text></svg>