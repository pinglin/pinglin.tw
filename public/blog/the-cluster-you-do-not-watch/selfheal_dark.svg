<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="100%" height="100%" fill="#1a1a2e" rx="8"/><defs><marker id="ar_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8f8f9c"/></marker><marker id="arb_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#2a78d6"/></marker><marker id="aro_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#eb6834"/></marker><marker id="arg_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1baf7a"/></marker></defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c9c9d4; font-size: 18px; }.title { font-size: 30px; font-weight: 700; fill: #ffffff; }.subtitle { font-size: 18.5px; fill: #c9c9d4; }.lab { fill: #ffffff; font-weight: 600; }.small { font-size: 16.5px; }.tiny { font-size: 15px; fill: #8f8f9c; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; }.mut { fill: #8f8f9c; }</style><text class="title" x="40" y="44">Three seconds of drift</text><text class="subtitle" x="40" y="74">One live edit against a pinned manifest, recorded verbatim as the reconciler answered it.</text><rect x="40" y="100" width="1020" height="296" rx="12" fill="#191927" stroke="#33334a" stroke-width="1.4"/><circle cx="68" cy="126" r="7" fill="#ff5f57"/><circle cx="94" cy="126" r="7" fill="#febc2e"/><circle cx="120" cy="126" r="7" fill="#28c840"/><text class="mono" x="66" y="168" style="fill:#1baf7a">$ </text><text class="mono" x="86" y="168" style="fill:#e8e8f0">kubectl -n observability scale deployment/backup-canary-exporter --replicas=2</text><text class="mono" x="66" y="195" style="fill:#8f8f9c">deployment.apps/backup-canary-exporter scaled</text><text class="mono" x="66" y="222" style="fill:#8f8f9c"></text><text class="mono" x="66" y="249" style="fill:#8f8f9c"># watcher: poll every 3 s, print on change   (git pins replicas: 1)</text><text class="mono" x="66" y="276" style="fill:#8f8f9c">12:08:24Z  spec.replicas=1  ready=1  app/exporters: Synced     op=Succeeded</text><text class="mono" x="66" y="303" style="fill:#eb6834">12:14:47Z  spec.replicas=2  ready=1  app/exporters: OutOfSync  op=Running</text><text class="mono" x="66" y="330" style="fill:#1baf7a">12:14:50Z  spec.replicas=1  ready=1  app/exporters: Synced     op=Running</text><text class="mono" x="66" y="357" style="fill:#8f8f9c">12:14:50Z  reverted &#8212; watcher exiting</text><path d="M812,298 L824,298 L824,332 L812,332" fill="none" stroke="#eb6834" stroke-width="1.8"/><text class="small" x="836" y="311.0" style="fill:#eb6834;font-weight:600">3 s</text><text class="tiny" x="836" y="329.0">Already syncing</text><text class="tiny" x="836" y="347.0">at first sight</text><rect x="40" y="426" width="1020" height="54" rx="9" fill="#24243a" stroke="#3a3a4e" stroke-width="1.2"/><text class="mono" x="60" y="458">Drift lifetime: &#8804;3 s &#183; Sustained-drift alert threshold: 1 h &#183; Messages produced: 0 &#183; Humans interrupted: 0</text></svg>