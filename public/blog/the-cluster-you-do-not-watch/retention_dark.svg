<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="574" viewBox="0 0 1100 574"><rect width="100%" height="100%" fill="#1a1a2e" rx="8"/><defs><marker id="ar_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8f8f9c"/></marker><marker id="arb_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#2a78d6"/></marker><marker id="aro_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#eb6834"/></marker><marker id="arg_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1baf7a"/></marker></defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c9c9d4; font-size: 18px; }.title { font-size: 30px; font-weight: 700; fill: #ffffff; }.subtitle { font-size: 18.5px; fill: #c9c9d4; }.lab { fill: #ffffff; font-weight: 600; }.small { font-size: 16.5px; }.tiny { font-size: 15px; fill: #8f8f9c; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; }.mut { fill: #8f8f9c; }</style><text class="title" x="40" y="44">The default was not wrong. It was wrong here.</text><text class="subtitle" x="40" y="74">How long a member may stall and still catch up incrementally, at our measured throughput.</text><text class="small lab" x="276" y="224" text-anchor="end">Retention 5,000 entries</text><text class="tiny" x="276" y="248" text-anchor="end">The shipped default</text><rect x="300" y="196" width="57.5" height="66" rx="8" fill="#1baf7a" stroke="#1baf7a" stroke-width="1.4" fill-opacity="0.20"/><rect x="357.5" y="196" width="692.5" height="66" rx="8" fill="#eb6834" stroke="#eb6834" stroke-width="1.4" fill-opacity="0.16"/><line x1="357.5" y1="182" x2="357.5" y2="276" stroke="#ffffff" stroke-width="2"/><text class="tiny" x="357.5" y="174" text-anchor="middle" style="font-weight:600;fill:#ffffff">9 min</text><text class="tiny" x="703.75" y="236" text-anchor="middle" style="fill:#eb6834">A transient blip becomes a dead member, deterministically</text><text class="small lab" x="276" y="352" text-anchor="end">Retention 50,000 entries</text><text class="tiny" x="276" y="376" text-anchor="end">Measured against our rate</text><rect x="300" y="324" width="575.0" height="66" rx="8" fill="#1baf7a" stroke="#1baf7a" stroke-width="1.4" fill-opacity="0.20"/><rect x="875.0" y="324" width="175.0" height="66" rx="8" fill="#eb6834" stroke="#eb6834" stroke-width="1.4" fill-opacity="0.16"/><line x1="875.0" y1="310" x2="875.0" y2="404" stroke="#ffffff" stroke-width="2"/><text class="tiny" x="875.0" y="302" text-anchor="middle" style="font-weight:600;fill:#ffffff">92 min</text><text class="tiny" x="587.5" y="364" text-anchor="middle" style="fill:#1baf7a">The same class of event now resolves itself</text><line x1="300" y1="424" x2="1050" y2="424" stroke="#3a3a4e" stroke-width="1.4"/><line x1="300.0" y1="424" x2="300.0" y2="431" stroke="#3a3a4e" stroke-width="1.4"/><text class="tiny" x="300.0" y="450" text-anchor="middle">0</text><line x1="393.75" y1="424" x2="393.75" y2="431" stroke="#3a3a4e" stroke-width="1.4"/><text class="tiny" x="393.75" y="450" text-anchor="middle">15</text><line x1="487.5" y1="424" x2="487.5" y2="431" stroke="#3a3a4e" stroke-width="1.4"/><text class="tiny" x="487.5" y="450" text-anchor="middle">30</text><line x1="581.25" y1="424" x2="581.25" y2="431" stroke="#3a3a4e" stroke-width="1.4"/><text class="tiny" x="581.25" y="450" text-anchor="middle">45</text><line x1="675.0" y1="424" x2="675.0" y2="431" stroke="#3a3a4e" stroke-width="1.4"/><text class="tiny" x="675.0" y="450" text-anchor="middle">60</text><line x1="768.75" y1="424" x2="768.75" y2="431" stroke="#3a3a4e" stroke-width="1.4"/><text class="tiny" x="768.75" y="450" text-anchor="middle">75</text><line x1="862.5" y1="424" x2="862.5" y2="431" stroke="#3a3a4e" stroke-width="1.4"/><text class="tiny" x="862.5" y="450" text-anchor="middle">90</text><line x1="956.25" y1="424" x2="956.25" y2="431" stroke="#3a3a4e" stroke-width="1.4"/><text class="tiny" x="956.25" y="450" text-anchor="middle">105</text><line x1="1050.0" y1="424" x2="1050.0" y2="431" stroke="#3a3a4e" stroke-width="1.4"/><text class="tiny" x="1050.0" y="450" text-anchor="middle">120</text><text class="tiny" x="1050" y="472" text-anchor="end">Minutes a member is stalled</text><text class="tiny" x="300" y="140" style="fill:#1baf7a;font-weight:600">Catches up incrementally</text><text class="tiny" x="1050" y="140" text-anchor="end" style="fill:#eb6834;font-weight:600">Needs a full snapshot &#8212; which frequently failed on our network</text><rect x="40" y="498" width="1020" height="54" rx="9" fill="#24243a" stroke="#3a3a4e" stroke-width="1.2"/><text class="mono" x="60" y="530">543 entries/min applied &#183; 5,000 &#247; 543 &#8776; 9 min &#183; 50,000 &#247; 543 &#8776; 92 min &#183; Cost of the fix: a few hundred MiB</text></svg>