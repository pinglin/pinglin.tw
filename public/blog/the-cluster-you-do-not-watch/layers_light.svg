<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="596" viewBox="0 0 1100 596"><rect width="100%" height="100%" fill="#fcfcfb" rx="8"/><defs><marker id="ar_light" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#898781"/></marker><marker id="arb_light" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#2a78d6"/></marker><marker id="aro_light" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#eb6834"/></marker><marker id="arg_light" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1baf7a"/></marker></defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52514e; font-size: 18px; }.title { font-size: 30px; font-weight: 700; fill: #0b0b0b; }.subtitle { font-size: 18.5px; fill: #52514e; }.lab { fill: #0b0b0b; font-weight: 600; }.small { font-size: 16.5px; }.tiny { font-size: 15px; fill: #898781; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; }.mut { fill: #898781; }</style><text class="title" x="40" y="44">Three layers of automatic fix</text><text class="subtitle" x="40" y="74">In descending order of what they are worth. The bar on the right is that order.</text><rect x="40" y="116" width="1020" height="118" rx="10" fill="#f3f2ec" stroke="#d8d7cd" stroke-width="1.2"/><rect x="40" y="116" width="6" height="118" rx="3" fill="#1baf7a"/><text class="lab" x="66" y="152">Configuration that makes the failure survivable</text><text class="small" x="66" y="181">Covers: an entire class of incident, before anything has to detect it.</text><text class="small mut" x="66" y="207">Costs: measurement. Almost always a parameter, not a mechanism.</text><rect x="810" y="156" width="230" height="18" rx="9" fill="#1baf7a" fill-opacity="0.85"/><text class="tiny" x="1040" y="198" text-anchor="end" style="fill:#1baf7a;font-weight:600">Removes the class</text><rect x="40" y="260" width="1020" height="118" rx="10" fill="#f3f2ec" stroke="#d8d7cd" stroke-width="1.2"/><rect x="40" y="260" width="6" height="118" rx="3" fill="#2a78d6"/><text class="lab" x="66" y="296">Reconciliation</text><text class="small" x="66" y="325">Covers: any divergence from declared state, continuously, as a non-event.</text><text class="small mut" x="66" y="351">Blind to: an unhealthy component that matches its spec, and any layer applied on demand.</text><rect x="890" y="300" width="150" height="18" rx="9" fill="#2a78d6" fill-opacity="0.85"/><text class="tiny" x="1040" y="342" text-anchor="end" style="fill:#2a78d6;font-weight:600">Removes the drift</text><rect x="40" y="404" width="1020" height="118" rx="10" fill="#f3f2ec" stroke="#d8d7cd" stroke-width="1.2"/><rect x="40" y="404" width="6" height="118" rx="3" fill="#eb6834"/><text class="lab" x="66" y="440">Gated repair, for everything destructive</text><text class="small" x="66" y="469">Covers: fixes that delete data, each step preceded by a live proof of safety.</text><text class="small mut" x="66" y="495">Refuses: to act on anything still advancing; to claim success unverified.</text><rect x="962" y="444" width="78" height="18" rx="9" fill="#eb6834" fill-opacity="0.85"/><text class="tiny" x="1040" y="486" text-anchor="end" style="fill:#eb6834;font-weight:600">Removes the gamble</text><text class="small" x="40" y="568" style="fill:#0b0b0b">The best automation of the incident below was a number, from the top layer.</text></svg>