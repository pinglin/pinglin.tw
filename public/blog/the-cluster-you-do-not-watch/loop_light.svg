<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="100%" height="100%" fill="#fcfcfb" rx="8"/><defs><marker id="ar_light" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#898781"/></marker><marker id="arb_light" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#2a78d6"/></marker><marker id="aro_light" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#eb6834"/></marker><marker id="arg_light" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1baf7a"/></marker></defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52514e; font-size: 18px; }.title { font-size: 30px; font-weight: 700; fill: #0b0b0b; }.subtitle { font-size: 18.5px; fill: #52514e; }.lab { fill: #0b0b0b; font-weight: 600; }.small { font-size: 16.5px; }.tiny { font-size: 15px; fill: #898781; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; }.mut { fill: #898781; }</style><text class="title" x="40" y="44">One ring, two planes</text><text class="subtitle" x="40" y="74">The agent reads without restriction and writes nothing directly. Every change it wants leaves as a diff.</text><rect x="40" y="96" width="1020" height="112" rx="10" fill="#f3f2ec" stroke="#d8d7cd" stroke-width="1.2"/><text class="tiny" x="60" y="122" style="fill:#2a78d6;font-weight:600">READ PLANE &#183; Live, unrestricted, no mutation</text><rect x="300" y="134" width="200" height="60" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text class="small lab" x="400" y="157" text-anchor="middle">Metrics</text><text class="tiny" x="400" y="178" text-anchor="middle">VictoriaMetrics</text><rect x="530" y="134" width="200" height="60" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text class="small lab" x="630" y="157" text-anchor="middle">Logs</text><text class="tiny" x="630" y="178" text-anchor="middle">Loki</text><rect x="760" y="134" width="200" height="60" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text class="small lab" x="860" y="157" text-anchor="middle">Platform API</text><text class="tiny" x="860" y="178" text-anchor="middle">Kubernetes</text><rect x="40" y="300" width="120" height="104" rx="10" fill="#ffffff" stroke="#898781" stroke-width="1.8"/><text class="lab" x="100.0" y="334" text-anchor="middle" style="font-size:16.5px">Alerting</text><text x="100.0" y="358" text-anchor="middle" style="font-size:12.5px;fill:#898781">Split by</text><text x="100.0" y="376" text-anchor="middle" style="font-size:12.5px;fill:#898781">severity</text><rect x="190" y="300" width="120" height="104" rx="10" fill="#ffffff" stroke="#898781" stroke-width="1.8"/><text class="lab" x="250.0" y="334" text-anchor="middle" style="font-size:16.5px">Chat</text><text x="250.0" y="358" text-anchor="middle" style="font-size:12.5px;fill:#898781">Human channel,</text><text x="250.0" y="376" text-anchor="middle" style="font-size:12.5px;fill:#898781">agent channel</text><rect x="340" y="300" width="120" height="104" rx="10" fill="#ffffff" stroke="#1baf7a" stroke-width="1.8"/><text class="lab" x="400.0" y="334" text-anchor="middle" style="font-size:16.5px">Agent</text><text x="400.0" y="358" text-anchor="middle" style="font-size:12.5px;fill:#898781">No mutating</text><text x="400.0" y="376" text-anchor="middle" style="font-size:12.5px;fill:#898781">credential</text><rect x="490" y="300" width="120" height="104" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/><text class="lab" x="550.0" y="334" text-anchor="middle" style="font-size:16.5px">Pull request</text><text x="550.0" y="358" text-anchor="middle" style="font-size:12.5px;fill:#898781">A diff a human</text><text x="550.0" y="376" text-anchor="middle" style="font-size:12.5px;fill:#898781">can read</text><rect x="640" y="300" width="120" height="104" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/><text class="lab" x="700.0" y="334" text-anchor="middle" style="font-size:16.5px">CI</text><text x="700.0" y="358" text-anchor="middle" style="font-size:12.5px;fill:#898781">Gate, by</text><text x="700.0" y="376" text-anchor="middle" style="font-size:12.5px;fill:#898781">construction</text><rect x="790" y="300" width="120" height="104" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/><text class="lab" x="850.0" y="334" text-anchor="middle" style="font-size:16.5px">Reconciler</text><text x="850.0" y="358" text-anchor="middle" style="font-size:12.5px;fill:#898781">Declared</text><text x="850.0" y="376" text-anchor="middle" style="font-size:12.5px;fill:#898781">state</text><rect x="940" y="300" width="120" height="104" rx="10" fill="#ffffff" stroke="#898781" stroke-width="1.8"/><text class="lab" x="1000.0" y="334" text-anchor="middle" style="font-size:16.5px">Cluster</text><text x="1000.0" y="358" text-anchor="middle" style="font-size:12.5px;fill:#898781">The thing</text><text x="1000.0" y="376" text-anchor="middle" style="font-size:12.5px;fill:#898781">being run</text><line x1="163" y1="352" x2="187" y2="352" stroke="#898781" stroke-width="2.2" marker-end="url(#ar_light)"/><text class="tiny" x="175.0" y="286" text-anchor="middle">Routes</text><line x1="313" y1="352" x2="337" y2="352" stroke="#898781" stroke-width="2.2" marker-end="url(#ar_light)"/><text class="tiny" x="325.0" y="286" text-anchor="middle">Picked up</text><line x1="463" y1="352" x2="487" y2="352" stroke="#898781" stroke-width="2.2" marker-end="url(#ar_light)"/><text class="tiny" x="475.0" y="286" text-anchor="middle">Opens</text><line x1="613" y1="352" x2="637" y2="352" stroke="#898781" stroke-width="2.2" marker-end="url(#ar_light)"/><text class="tiny" x="625.0" y="286" text-anchor="middle">Must pass</text><line x1="763" y1="352" x2="787" y2="352" stroke="#898781" stroke-width="2.2" marker-end="url(#ar_light)"/><text class="tiny" x="775.0" y="286" text-anchor="middle">On merge</text><line x1="913" y1="352" x2="937" y2="352" stroke="#898781" stroke-width="2.2" marker-end="url(#ar_light)"/><text class="tiny" x="925.0" y="286" text-anchor="middle">Applies</text><line x1="100" y1="208" x2="100" y2="296" stroke="#898781" stroke-width="2.0" stroke-dasharray="5 5" marker-end="url(#ar_light)"/><text class="tiny" x="118" y="256">Rules fire</text><line x1="400" y1="208" x2="400" y2="296" stroke="#2a78d6" stroke-width="2.0" stroke-dasharray="5 5" marker-end="url(#arb_light)"/><text class="tiny" x="418" y="256" style="fill:#2a78d6">Live read</text><line x1="1000" y1="296" x2="1000" y2="208" stroke="#898781" stroke-width="2.0" stroke-dasharray="5 5" marker-end="url(#ar_light)"/><text class="tiny" x="982" y="256" text-anchor="end">Observed by</text><path d="M400,408 L400,472 L1000,472 L1000,408" fill="none" stroke="#eb6834" stroke-width="2" stroke-dasharray="7 6" opacity="0.75"/><circle cx="700" cy="472" r="17" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/><path d="M693,465 L707,479 M707,465 L693,479" stroke="#eb6834" stroke-width="2.6" stroke-linecap="round"/><text class="small" x="700" y="512" text-anchor="middle" style="fill:#eb6834">There is no mode where the agent skips this. No credential exists for the direct path.</text></svg>