<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660"><rect width="100%" height="100%" fill="#1a1a2e" rx="8"/><defs><marker id="ar_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8f8f9c"/></marker><marker id="arb_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#2a78d6"/></marker><marker id="aro_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#eb6834"/></marker><marker id="arg_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1baf7a"/></marker></defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c9c9d4; font-size: 18px; }.title { font-size: 30px; font-weight: 700; fill: #ffffff; }.subtitle { font-size: 18.5px; fill: #c9c9d4; }.lab { fill: #ffffff; font-weight: 600; }.small { font-size: 16.5px; }.tiny { font-size: 15px; fill: #8f8f9c; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; }.mut { fill: #8f8f9c; }</style><text class="title" x="40" y="44">A report that states what it could not see</text><text class="subtitle" x="40" y="74">Absence of evidence is evidence of absence only once you have shown you would have seen it.</text><rect x="40" y="108" width="500" height="358" rx="10" fill="#24243a" stroke="#3a3a4e" stroke-width="1.2"/><text class="lab small" x="62" y="138">Two inputs, one output</text><rect x="62" y="166" width="190" height="54" rx="8" fill="#2e2e46" stroke="#1baf7a" stroke-width="1.5"/><text class="tiny" x="157" y="198" text-anchor="middle" style="font-weight:600;fill:#1baf7a">Healthy system</text><line x1="258" y1="193" x2="300" y2="193" stroke="#8f8f9c" stroke-width="1.8" marker-end="url(#ar_dark)"/><rect x="62" y="240" width="190" height="54" rx="8" fill="#2e2e46" stroke="#eb6834" stroke-width="1.5"/><text class="tiny" x="157" y="272" text-anchor="middle" style="font-weight:600;fill:#eb6834">Dead collector</text><line x1="258" y1="267" x2="300" y2="267" stroke="#8f8f9c" stroke-width="1.8" marker-end="url(#ar_dark)"/><rect x="306" y="166" width="212" height="128" rx="8" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.4"/><text class="small" x="412" y="222" text-anchor="middle" style="fill:#ffffff;font-weight:600">"No problems</text><text class="small" x="412" y="246" text-anchor="middle" style="fill:#ffffff;font-weight:600">found"</text><text class="tiny" x="412" y="316" text-anchor="middle">Indistinguishable</text><rect x="62" y="336" width="456" height="106" rx="9" fill="#eb6834" stroke="#eb6834" stroke-width="1.5" fill-opacity="0.10"/><text class="small" x="82" y="366" style="fill:#eb6834;font-weight:600">So the digest proves its source first</text><text class="tiny" x="82" y="392">It says so in the report, every day, before any</text><text class="tiny" x="82" y="414">claim about the fleet is allowed to appear.</text><rect x="570" y="108" width="490" height="358" rx="10" fill="#24243a" stroke="#3a3a4e" stroke-width="1.2"/><text class="lab small" x="592" y="138">What it ships, every morning</text><rect x="592" y="164" width="446" height="36" rx="7" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.1"/><text x="610" y="189" style="font-size:15px;fill:#1baf7a;font-weight:700">&#10003;</text><text class="mono" x="634" y="188" style="fill:#c9c9d4">Source live: 42 samples in the last 5 min</text><rect x="592" y="208" width="446" height="36" rx="7" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.1"/><text x="610" y="233" style="font-size:15px;fill:#2a78d6;font-weight:700">&#10003;</text><text class="mono" x="634" y="232" style="fill:#c9c9d4">Tier 1 healthy &#8212; 0 restarts / 24 h</text><rect x="592" y="252" width="446" height="36" rx="7" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.1"/><text x="610" y="277" style="font-size:15px;fill:#2a78d6;font-weight:700">&#10003;</text><text class="mono" x="634" y="276" style="fill:#c9c9d4">Tier 2 healthy &#8212; p99 lag 240 ms</text><rect x="592" y="296" width="446" height="36" rx="7" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.1"/><text x="610" y="321" style="font-size:15px;fill:#2a78d6;font-weight:700">&#10003;</text><text class="mono" x="634" y="320" style="fill:#c9c9d4">Backups current &#8212; 28 GiB, 3 h old</text><rect x="592" y="340" width="446" height="36" rx="7" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.1"/><text x="610" y="365" style="font-size:15px;fill:#eb6834;font-weight:700">!</text><text class="mono" x="634" y="364" style="fill:#c9c9d4">Could not see: RBAC gap on one resource type</text><text class="tiny" x="592" y="404" style="fill:#eb6834">The gap is reported daily, beside the proxy signals used instead</text><text class="tiny" x="592" y="430">Lands as a pull request &#183; CI posts the summary to the channel</text><text class="tiny" x="592" y="452">A human merges it to keep the history, or closes it</text><rect x="40" y="496" width="1020" height="122" rx="10" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.2"/><rect x="40" y="496" width="6" height="122" rx="3" fill="#eb6834"/><text class="lab small" x="70" y="526" style="fill:#eb6834">Correction &#183; Added four days later</text><text class="small" x="70" y="556">The first diagnosis blamed the network. It was wrong, and it stays on the page.</text><text class="small mut" x="70" y="584">The reasoning that produced a confident wrong answer is the most reusable artifact an incident generates;</text><text class="small mut" x="70" y="606">deleting it guarantees somebody rediscovers it.</text></svg>