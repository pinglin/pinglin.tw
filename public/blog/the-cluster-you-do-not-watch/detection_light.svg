xt x="266" y="170" style="font-size:16px;fill:#1baf7a;font-weight:700">&#10003;</text><text class="small" x="230" y="210" text-anchor="end">Process is up</text><rect x="250" y="188" width="800" height="30" rx="6" fill="#1baf7a" stroke="#1baf7a" stroke-width="1.2" fill-opacity="0.18"/><text x="266" y="210" style="font-size:16px;fill:#1baf7a;font-weight:700">&#10003;</text><text class="tiny" x="1050" y="102" text-anchor="end">Green for the entire window</text><line x1="250" y1="500" x2="1050" y2="500" stroke="#d8d7cd" stroke-width="1.4"/><line x1="250" y1="280" x2="250" y2="500" stroke="#d8d7cd" stroke-width="1.4"/><text class="tiny" x="230" y="286" text-anchor="end">Applied index</text><text class="tiny" x="1050" y="526" text-anchor="end">Time</text><path d="M250,468 L1050,300 L1050,421.8 L470,421.8 Z" fill="#eb6834" opacity="0.13"/><line x1="250" y1="468" x2="1050" y2="300" stroke="#1baf7a" stroke-width="3" stroke-linecap="round"/><path d="M250,468 L470,421.8 L1050,421.8" fill="none" stroke="#2a78d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="small" x="1042" y="286" text-anchor="end" style="fill:#1baf7a;font-weight:600">Leader</text><text class="small" x="1042" y="449.8" text-anchor="end" style="fill:#2a78d6;font-weight:600">Member</text><line x1="470" y1="272" x2="470" y2="500" stroke="#898781" stroke-width="1.4" stroke-dasharray="4 5"/><text class="tiny" x="480" y="268">Member stops participating</text><line x1="800" y1="352.5" x2="800" y2="421.8" stroke="#898781" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="900" y1="331.5" x2="900" y2="421.8" stroke="#898781" stroke-width="1.2" stroke-dasharray="3 4"/><text class="tiny" x="850.0" y="526" text-anchor="middle">Two samples, 30 s apart</text><text class="small" x="792" y="336.5" text-anchor="end" style="fill:#1baf7a;font-weight:600">Leader +150 entries</text><text class="small" x="792" y="447.8" text-anchor="end" style="fill:#2a78d6;font-weight:600">Member +0</text><rect x="250" y="536" width="800" height="44" rx="9" fill="#eb6834" stroke="#eb6834" stroke-width="1.4" fill-opacity="0.12"/><text class="small" x="650" y="564" text-anchor="middle" style="fill:#eb6834;font-weight:600">The alert keys on the pair &#183; Has a leader, committing nothing</text></svg>