<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580"><rect width="100%" height="100%" fill="#1a1a2e" rx="8"/><defs><marker id="ar_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#8f8f9c"/></marker><marker id="arb_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#2a78d6"/></marker><marker id="aro_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#eb6834"/></marker><marker id="arg_dark" markerWidth="14" markerHeight="12" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,5 L0,10 Z" fill="#1baf7a"/></marker></defs><style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #c9c9d4; font-size: 18px; }.title { font-size: 30px; font-weight: 700; fill: #ffffff; }.subtitle { font-size: 18.5px; fill: #c9c9d4; }.lab { fill: #ffffff; font-weight: 600; }.small { font-size: 16.5px; }.tiny { font-size: 15px; fill: #8f8f9c; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 15px; }.mut { fill: #8f8f9c; }</style><text class="title" x="40" y="44">A check that cannot fail is not a check</text><text class="subtitle" x="40" y="74">A broken check and a passing check produce identical output: silence, and a green mark.</text><rect x="40" y="110" width="490" height="282" rx="10" fill="#24243a" stroke="#3a3a4e" stroke-width="1.2"/><text class="lab small" x="62" y="140" style="fill:#1baf7a">An honest check</text><rect x="330" y="178" width="178" height="170" rx="6" fill="#eb6834" opacity="0.10"/><text class="tiny" x="419" y="196" text-anchor="middle" style="fill:#eb6834">Actually broken</text><line x1="130" y1="348" x2="508" y2="348" stroke="#3a3a4e" stroke-width="1.3"/><line x1="130" y1="208" x2="130" y2="348" stroke="#3a3a4e" stroke-width="1.3"/><text class="tiny" x="118" y="235" text-anchor="end">Pass</text><line x1="130" y1="230" x2="508" y2="230" stroke="#3a3a4e" stroke-width="1" stroke-dasharray="3 5"/><text class="tiny" x="118" y="327" text-anchor="end">Fail</text><line x1="130" y1="322" x2="508" y2="322" stroke="#3a3a4e" stroke-width="1" stroke-dasharray="3 5"/><path d="M136,230 L330,230 L330,322 L500,322" fill="none" stroke="#1baf7a" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><text class="small" x="419" y="306" text-anchor="middle" style="fill:#1baf7a;font-weight:600">Goes red</text><text class="tiny" x="130" y="372">Healthy</text><text class="tiny" x="508" y="372" text-anchor="end">Broken</text><rect x="570" y="110" width="490" height="282" rx="10" fill="#24243a" stroke="#3a3a4e" stroke-width="1.2"/><text class="lab small" x="592" y="140" style="fill:#eb6834">A check that cannot fail</text><rect x="860" y="178" width="178" height="170" rx="6" fill="#eb6834" opacity="0.10"/><text class="tiny" x="949" y="196" text-anchor="middle" style="fill:#eb6834">Actually broken</text><line x1="660" y1="348" x2="1038" y2="348" stroke="#3a3a4e" stroke-width="1.3"/><line x1="660" y1="208" x2="660" y2="348" stroke="#3a3a4e" stroke-width="1.3"/><text class="tiny" x="648" y="235" text-anchor="end">Pass</text><line x1="660" y1="230" x2="1038" y2="230" stroke="#3a3a4e" stroke-width="1" stroke-dasharray="3 5"/><text class="tiny" x="648" y="327" text-anchor="end">Fail</text><line x1="660" y1="322" x2="1038" y2="322" stroke="#3a3a4e" stroke-width="1" stroke-dasharray="3 5"/><line x1="666" y1="230" x2="1030" y2="230" stroke="#eb6834" stroke-width="3.4" stroke-linecap="round"/><text class="small" x="949" y="260" text-anchor="middle" style="fill:#eb6834;font-weight:600">Still passing</text><text class="tiny" x="660" y="372">Healthy</text><text class="tiny" x="1038" y="372" text-anchor="end">Broken</text><rect x="40" y="424" width="324" height="82" rx="9" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.2"/><text class="tiny" x="56" y="450" style="font-weight:600;fill:#ffffff">Privilege mismatch</text><text class="tiny" x="56" y="472">An existence test run as the wrong user</text><text class="tiny" x="56" y="492">returns false either way</text><rect x="388" y="424" width="324" height="82" rx="9" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.2"/><text class="tiny" x="404" y="450" style="font-weight:600;fill:#ffffff">Operator precedence</text><text class="tiny" x="404" y="472">The threshold filters the join key rather</text><text class="tiny" x="404" y="492">than the value you meant</text><rect x="736" y="424" width="324" height="82" rx="9" fill="#2e2e46" stroke="#3a3a4e" stroke-width="1.2"/><text class="tiny" x="752" y="450" style="font-weight:600;fill:#ffffff">Reading the wrong instance</text><text class="tiny" x="752" y="472">Oldest-first ordering reports a value from</text><text class="tiny" x="752" y="492">a previous boot</text><text class="small" x="550" y="546" text-anchor="middle" style="fill:#ffffff">The rule: mutate the input until it goes red. A guard never observed refusing is not a guard.</text></svg>